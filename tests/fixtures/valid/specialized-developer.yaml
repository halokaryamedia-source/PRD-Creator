document:
  id: developer-only
  title: DEVELOPER DOCUMENT
  profile: specialized_document
  specialization: developer_only
  primary_language: id
  output_languages:
  - id
  - en
  content_version: '0.1'
  status: approved
specialized_content:
  developer:
    status: approved
    overview:
      id: Implementasikan progres ore, The Forge, scoring, dan reset.
      en: Implement ore progression, The Forge, scoring, and reset.
    development_goal:
      id: Menjalankan The Quarry secara terpisah per Session.
      en: Run The Quarry independently per Session.
    expected_result:
      id: Objective menghasilkan satu Beacon Core dan satu hasil valid.
      en: The objective creates one Beacon Core and one valid result.
    development_flow:
    - number: '01'
      title:
        id: Mechanic Setup
        en: Mechanic Setup
      description:
        id: Siapkan cave dan Required Ore.
        en: Siapkan cave dan Required Ore.
    - number: '02'
      title:
        id: Gameplay Setup
        en: Gameplay Setup
      description:
        id: Kontrol progres Bronze, Silver, dan Gold.
        en: Kontrol progres Bronze, Silver, dan Gold.
    - number: '03'
      title:
        id: Data Setup
        en: Data Setup
      description:
        id: Catat completion dan score.
        en: Catat completion dan score.
    - number: '04'
      title:
        id: Reset Mechanic
        en: Reset Mechanic
      description:
        id: Pulihkan state sebelum arena digunakan ulang.
        en: Pulihkan state sebelum arena digunakan ulang.
    requirements:
    - number: 1
      title:
        id: Mechanic Setup
        en: Mechanic Setup
      items:
      - code: A
        title:
          id: Ore progression
          en: Ore progression
        requirements:
        - id: Validasi Required Ore per cave.
          en: Validasi Required Ore per cave.
        - id: Buka cave berikutnya setelah syarat terpenuhi.
          en: Buka cave berikutnya setelah syarat terpenuhi.
        result:
          id: Progress cave konsisten.
          en: Progress cave konsisten.
    - number: 2
      title:
        id: Reset Mechanic
        en: Reset Mechanic
      items:
      - code: A
        title:
          id: Reset and verification
          en: Reset and verification
        requirements:
        - id: Hapus item sementara.
          en: Hapus item sementara.
        - id: Pulihkan ore dan The Forge.
          en: Pulihkan ore dan The Forge.
        - id: Lepaskan arena setelah verifikasi.
          en: Lepaskan arena setelah verifikasi.
        result:
          id: Arena siap digunakan ulang.
          en: Arena siap digunakan ulang.
    important_notes:
    - id: Semua state harus scoped ke Session.
      en: All state must be scoped to the Session.
    terms:
    - session
    - assigned_arena
    completion_data:
      produces_score: false
      valid_completion_condition:
        id: Selesai saat player menerima Communicator.
        en: Complete when the player receives the Communicator.
      recorded_data:
      - id: communicator_received
        description:
          id: Status Communicator diterima.
          en: Communicator received state.
        type: boolean
      interrupted_completion_behavior:
        id: Progress onboarding yang belum selesai direset.
        en: Incomplete onboarding progress is reset.
      duplicate_prevention:
        id: Communicator hanya diberikan sekali per Session.
        en: Give the Communicator once per Session.
      handoff_result:
        id: Player membawa Communicator ke The Quarry.
        en: The player carries the Communicator into The Quarry.
