decisions:
- id: D-001
  scope: quarry
  topic: completion_condition
  decision:
    id: The Quarry selesai saat player mengambil Beacon Core.
    en: The Quarry completes when the player takes the Beacon Core.
  status: approved
  reason:
    id: Item harus dimiliki sebelum The Ascent.
    en: The item must be owned before The Ascent.
  affects:
  - gameplay_overview
  - timer_stop
  - scoring
  - objective_handoff
  source_refs:
  - type: source
    ref: source-prd-quarry
  created_at: '2026-07-19'
  updated_at: '2026-07-19'
- id: D-002
  scope: quarry
  topic: target_time
  decision:
    id: Sembilan menit adalah target scoring, bukan hard timeout.
    en: Nine minutes is a scoring target, not a hard timeout.
  status: approved
  reason:
    id: Player tetap dapat menyelesaikan objective setelah target.
    en: The player may still complete the objective after the target.
  affects:
  - gameplay_information
  - scoring
  source_refs:
  - type: decision
    ref: D-001
  created_at: '2026-07-19'
  updated_at: '2026-07-19'
