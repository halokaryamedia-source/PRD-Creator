name: Production Assets Visual Proof
# one-shot browser proof after mixed-page validator correction

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/production-assets-proof.yml"

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Local

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install proof dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip install --disable-pip-version-check selenium
          python -m pip check

      - name: Rerender Clockwork from canonical sources
        run: |
          python kits/project-document-generator/renderer/render.py \
            workspace/active/the-clockwork-vault/work/render-data.json \
            workspace/active/the-clockwork-vault/output/final.html
          python kits/voice-production-kit/validator/validate.py \
            workspace/active/the-clockwork-vault

      - name: Build temporary generic asset fixture
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          from tests.test_prd_contracts import render_data
          from tests.test_prd_voice_assets import ASSETS

          root = Path.cwd()
          project = Path('/tmp/production-assets-proof')
          (project / 'work').mkdir(parents=True, exist_ok=True)
          (project / 'output').mkdir(parents=True, exist_ok=True)
          (project / 'work' / 'render-data.json').write_text(
              json.dumps(render_data(), ensure_ascii=False), encoding='utf-8'
          )
          (project / 'work' / 'asset-requirements.md').write_text(ASSETS, encoding='utf-8')
          subprocess.run([
              sys.executable,
              str(root / 'kits/project-document-generator/renderer/render.py'),
              str(project / 'work/render-data.json'),
              str(project / 'output/final.html'),
          ], check=True)
          PY

      - name: Browser inspect Production Assets
        run: |
          mkdir -p /tmp/production-assets-screens
          python - <<'PY'
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          root = Path.cwd()
          targets = [
              ('clockwork', root / 'workspace/active/the-clockwork-vault/output/final.html', 6, True),
              ('generic', Path('/tmp/production-assets-proof/output/final.html'), 2, False),
          ]

          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--hide-scrollbars')
          driver = webdriver.Chrome(options=opts)
          try:
              for name, html_path, expected_links, has_voice in targets:
                  driver.get(html_path.resolve().as_uri())
                  for width in (1500, 1000):
                      driver.set_window_size(width, 1000)
                      driver.execute_script("window.scrollTo(0,0)")
                      result = driver.execute_script('''
                        const nav = document.querySelector('.production-assets-nav');
                        const links = [...document.querySelectorAll('.production-assets-nav .nav-submenu a')];
                        const pages = [...document.querySelectorAll('.production-assets-page')];
                        const oldCategory = document.querySelector('.production-assets-category');
                        const overflowingLinks = links.filter(el => el.scrollWidth > el.clientWidth + 1).length;
                        const overflowingCards = [...document.querySelectorAll('.pa-card,.voice-script-card')]
                          .filter(el => el.scrollWidth > el.clientWidth + 1).length;
                        const zeroText = [...document.querySelectorAll('.pa-group-head span,.pa-summary span')]
                          .some(el => /\b0\s+Assets\b/.test(el.textContent.trim()));
                        return {
                          nav: !!nav,
                          linkCount: links.length,
                          pageCount: pages.length,
                          oldCategory: !!oldCategory,
                          overflowingLinks,
                          overflowingCards,
                          bodyOverflow: document.documentElement.scrollWidth > window.innerWidth + 2,
                          zeroText,
                          voiceCards: document.querySelectorAll('.voice-script-card').length,
                          audioGroups: [...document.querySelectorAll('.pa-group-head h3')].filter(el => el.textContent.trim() === 'Audio').length,
                          modelCards: [...document.querySelectorAll('.pa-card h4')].filter(el => el.textContent.includes('Trial Console')).length,
                          contentText: document.body.innerText.includes('BEGIN THE CORE TRIAL') && document.body.innerText.includes('TRIAL COMPLETE')
                        };
                      ''')
                      assert result['nav'], (name, width, result)
                      assert result['linkCount'] == expected_links, (name, width, result)
                      assert result['pageCount'] == expected_links, (name, width, result)
                      assert not result['oldCategory'], (name, width, result)
                      assert result['overflowingLinks'] == 0, (name, width, result)
                      assert result['overflowingCards'] == 0, (name, width, result)
                      assert not result['bodyOverflow'], (name, width, result)
                      assert not result['zeroText'], (name, width, result)
                      if has_voice:
                          assert result['voiceCards'] > 0, (name, width, result)
                          assert result['audioGroups'] == expected_links, (name, width, result)
                      else:
                          assert result['voiceCards'] == 0, (name, width, result)
                          assert result['modelCards'] == 1, (name, width, result)
                          assert result['contentText'], (name, width, result)
                      out = Path('/tmp/production-assets-screens') / f'{name}-{width}.png'
                      driver.save_screenshot(str(out))
                      print(name, width, result)
          finally:
              driver.quit()
          PY

      - name: Upload browser proof
        uses: actions/upload-artifact@v4
        with:
          name: production-assets-visual-proof
          path: /tmp/production-assets-screens/*.png

      - name: Commit regenerated Clockwork output and remove proof workflow
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          rm .github/workflows/production-assets-proof.yml
          git add workspace/active/the-clockwork-vault/output/final.html .github/workflows/production-assets-proof.yml
          git commit -m "render: refresh Clockwork objective-first Production Assets" || true
          git push origin HEAD:Local
