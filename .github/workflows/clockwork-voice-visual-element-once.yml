name: Clockwork Voice Visual Element Once

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/clockwork-voice-visual-element-once.yml"

permissions:
  contents: write

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium==4.35.0

      - name: Capture Voice section elements
        run: |
          python - <<'PY'
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          import time

          html = Path('workspace/active/the-clockwork-vault/output/final.html').resolve().as_uri()
          out = Path('visual-review')
          out.mkdir()

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--hide-scrollbars')
          options.add_argument('--window-size=1600,1400')

          driver = webdriver.Chrome(options=options)
          try:
              driver.get(html)
              driver.set_window_size(1600, 1400)
              driver.execute_script("""
                document.body.classList.remove('view-clean');
                document.body.classList.add('view-professional');
                document.querySelectorAll('.professional-only').forEach(function(el){
                  el.style.setProperty('display','block','important');
                });
              """)
              time.sleep(0.2)
              targets = [
                  ('01-voice-cast-antechamber.png', 'production-assets-voice-1'),
                  ('02-broken-gallery.png', 'production-assets-voice-3'),
                  ('03-workshop.png', 'production-assets-voice-5'),
                  ('04-ending.png', 'production-assets-voice-6'),
              ]
              for filename, element_id in targets:
                  element = driver.find_element(By.ID, element_id)
                  driver.execute_script("arguments[0].scrollIntoView({block:'start'});", element)
                  time.sleep(0.1)
                  element.screenshot(str(out / filename))
          finally:
              driver.quit()
          PY

      - name: Upload visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: clockwork-voice-element-visual-review
          path: visual-review/*.png
          if-no-files-found: error
          retention-days: 1

      - name: Remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/clockwork-voice-visual-element-once.yml
          git commit -m "chore: remove Clockwork voice element visual workflow"
          git push origin HEAD:Local
