name: Temp RQ05 RQ13 Asset Identity

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/temp-rq05-rq13-asset-identity.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply Production Assets identity cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def read(rel: str) -> str:
              return (ROOT / rel).read_text(encoding="utf-8")

          def write(rel: str, text: str) -> None:
              (ROOT / rel).write_text(text, encoding="utf-8")

          # RQ-05/RQ-13: use stable semantic DOM identity and a distinct PA footer-code namespace.
          rel = "kits/project-document-generator/renderer/production_assets_objective.py"
          text = read(rel)
          text = text.replace(
              "from core import bi, esc, i18n, page, txt",
              "from core import bi, esc, i18n, page, slug, txt",
              1,
          )
          old = '''@dataclass\nclass SectionPresentation:\n    title: str\n    package_label: Any\n    context: Any\n'''
          new = '''@dataclass\nclass SectionPresentation:\n    title: str\n    package_label: Any\n    context: Any\n    page_id: str\n'''
          if old not in text:
              raise SystemExit("SectionPresentation dataclass marker missing")
          text = text.replace(old, new, 1)

          old = '''        return SectionPresentation(\n            SHARED_SECTION,\n            bi("Shared", "Shared"),\n            bi(\n                "Assets reused across multiple gameplay sections.",\n                "Asset yang digunakan ulang di beberapa bagian gameplay.",\n            ),\n        )\n'''
          new = '''        return SectionPresentation(\n            SHARED_SECTION,\n            bi("Shared", "Shared"),\n            bi(\n                "Assets reused across multiple gameplay sections.",\n                "Asset yang digunakan ulang di beberapa bagian gameplay.",\n            ),\n            "production-assets-global-shared",\n        )\n'''
          if old not in text:
              raise SystemExit("shared SectionPresentation marker missing")
          text = text.replace(old, new, 1)

          old = '''            return SectionPresentation(\n                title,\n                package.get("package_label", f"Gameplay {index + 1}"),\n                package.get("gameplay", {}).get("context", ""),\n            )\n'''
          new = '''            package_id = str(package.get("id") or slug(title))\n            return SectionPresentation(\n                title,\n                package.get("package_label", f"Gameplay {index + 1}"),\n                package.get("gameplay", {}).get("context", ""),\n                f"production-assets-{slug(package_id)}",\n            )\n'''
          if old not in text:
              raise SystemExit("package SectionPresentation marker missing")
          text = text.replace(old, new, 1)

          old = '''            return SectionPresentation(title, bi(label, label), item.get("description", ""))\n'''
          new = '''            return SectionPresentation(\n                title,\n                bi(label, label),\n                item.get("description", ""),\n                f"production-assets-journey-{slug(title)}",\n            )\n'''
          if old not in text:
              raise SystemExit("journey SectionPresentation marker missing")
          text = text.replace(old, new, 1)

          old = '''        index = len(pages)\n        pid = f"production-assets-{index + 1}"\n        pages.append(\n            page(\n                pid,\n                f"04{chr(65 + index)}",\n'''
          new = '''        index = len(pages)\n        pid = meta.page_id\n        pages.append(\n            page(\n                pid,\n                f"PA-{index + 1:02d}",\n'''
          if old not in text:
              raise SystemExit("Production Assets page identity marker missing")
          text = text.replace(old, new, 1)
          write(rel, text)

          # Focused renderer regressions.
          rel = "tests/test_prd_voice_assets.py"
          text = read(rel)
          marker = '        self.assertEqual(html.count(\'data-target="production-assets-\'), 2)\n'
          addition = marker + '''        self.assertIn('id="production-assets-journey-the-journey-begins"', html)\n        self.assertIn('id="production-assets-core"', html)\n        self.assertIn('data-en="PA-01" data-id="PA-01">PA-01</span>', html)\n        self.assertIn('data-en="PA-02" data-id="PA-02">PA-02</span>', html)\n'''
          if marker not in text:
              raise SystemExit("voice assets navigation count marker missing")
          text = text.replace(marker, addition, 1)

          marker = '        self.assertEqual(html.count(\'data-target="production-assets-\'), 3)\n'
          addition = marker + '''        self.assertIn('id="production-assets-global-shared"', html)\n        self.assertIn('id="production-assets-journey-the-journey-begins"', html)\n        self.assertIn('id="production-assets-core"', html)\n        self.assertIn('data-en="PA-03" data-id="PA-03">PA-03</span>', html)\n'''
          if marker not in text:
              raise SystemExit("mixed assets navigation count marker missing")
          text = text.replace(marker, addition, 1)

          test = '''\n    def test_objective_page_id_is_stable_when_shared_assets_are_added(self) -> None:\n        core_only = ASSETS.split("## Global / Shared Assets", 1)[0] + "# Production Asset Requirements\\n\\n" if False else None\n        core_section = "# Production Asset Requirements\\n\\n" + ASSETS.split("## 02. Core Trial", 1)[1]\n        core_section = "# Production Asset Requirements\\n\\n## 02. Core Trial" + core_section.split("# Production Asset Requirements", 1)[1]\n        without_shared, output_without = self.render(\n            self.make_project(include_voice=False, include_assets=True, asset_text=core_section)\n        )\n        self.assertEqual(without_shared.returncode, 0, without_shared.stderr or without_shared.stdout)\n        html_without = output_without.read_text(encoding="utf-8")\n        self.assertIn('id="production-assets-core"', html_without)\n\n        with_shared, output_with = self.render(\n            self.make_project(include_voice=False, include_assets=True)\n        )\n        self.assertEqual(with_shared.returncode, 0, with_shared.stderr or with_shared.stdout)\n        html_with = output_with.read_text(encoding="utf-8")\n        self.assertIn('id="production-assets-global-shared"', html_with)\n        self.assertIn('id="production-assets-core"', html_with)\n\n'''
          if "test_objective_page_id_is_stable_when_shared_assets_are_added" not in text:
              final_marker = '\n\nif __name__ == "__main__":\n'
              if final_marker not in text:
                  raise SystemExit("test_prd_voice_assets final marker missing")
              text = text.replace(final_marker, test + final_marker, 1)
          write(rel, text)

          # Current renderer contract documents distinct visible code namespace + semantic DOM identity.
          rel = "kits/project-document-generator/RENDERING.md"
          text = read(rel)
          old = "- Production Assets pages use their own identities (`04A`, `04B`, ...);"
          new = "- Production Assets keep top-level navigation number `04`, but their page footer codes use the distinct `PA-01`, `PA-02`, ... namespace so they cannot be confused with accepted PRD Development page codes; DOM page IDs are stable semantic identities derived from the owning shared/journey/package section rather than current list position;"
          if old not in text:
              raise SystemExit("RENDERING Production Assets identity rule missing")
          text = text.replace(old, new, 1)
          write(rel, text)

          # Durable tracking.
          rel = "docs/knowledge/reviews/repository-quality-audit-2026-08-14.md"
          text = read(rel)
          old = "| RQ-05 | P1 | Development package page codes and Production Assets page codes can both produce `04A`, `04B`, etc. | Human/developer page references become ambiguous. | OPEN |"
          new = "| RQ-05 | P1 | Development and Production Assets page codes could both produce `04A`, `04B`, etc. | Human/developer page references became ambiguous. | FIXED — Production Assets footer codes use `PA-01`, `PA-02`, ... |"
          if old not in text:
              raise SystemExit("RQ-05 audit row missing")
          text = text.replace(old, new, 1)
          old = "| RQ-13 | P3 | Production Assets page IDs are position-based (`production-assets-1`, `-2`, ...). Adding a new earlier section can move deep-link identities inside the same PRD version. | Unstable links and harder continuation. | OPEN |"
          new = "| RQ-13 | P3 | Production Assets page IDs were position-based (`production-assets-1`, `-2`, ...). | Adding an earlier section could move deep-link identities inside the same PRD version. | FIXED — semantic shared/journey/package DOM identities |"
          if old not in text:
              raise SystemExit("RQ-13 audit row missing")
          text = text.replace(old, new, 1)
          update = "## Remediation update — RQ-05/RQ-13 Production Assets identity\n\nProduction Assets still owns top-level section `04`, but its page footer codes now use a separate `PA-##` namespace and its DOM IDs derive from semantic shared/journey/package identity. Accepted PRD Development page codes/IDs are unchanged. This removes human code ambiguity and position-based deep-link drift without a registry.\n\n"
          if "## Remediation update — RQ-05/RQ-13 Production Assets identity" not in text:
              marker = "## Ordered remediation\n"
              if marker not in text:
                  raise SystemExit("audit Ordered remediation marker missing")
              text = text.replace(marker, update + marker, 1)
          write(rel, text)

          rel = "docs/knowledge/operations/backlog.md"
          text = read(rel)
          line = "1. **RQ-05 + RQ-13 — Production Assets identity (P1):** remove visible `04A`/`04B` ambiguity and use stable semantic Production Assets DOM IDs while preserving accepted PRD Development page identities. Visual proof is required because visible page codes/navigation change.\n"
          if line not in text:
              raise SystemExit("backlog RQ-05/RQ-13 line missing")
          text = text.replace(line, "", 1)
          text = text.replace("2. **RQ-07", "1. **RQ-07", 1)
          text = text.replace("3. **RQ-08", "2. **RQ-08", 1)
          text = text.replace("4. **RQ-09", "3. **RQ-09", 1)
          text = text.replace("5. **RQ-10", "4. **RQ-10", 1)
          text = text.replace("6. **RQ-14", "5. **RQ-14", 1)
          text = text.replace(
              "Closed items RQ-01, RQ-02, RQ-03, RQ-04, RQ-06, RQ-12, RQ-15, and RQ-16",
              "Closed items RQ-01, RQ-02, RQ-03, RQ-04, RQ-05, RQ-06, RQ-12, RQ-13, RQ-15, and RQ-16",
              1,
          )
          write(rel, text)

          write("docs/knowledge/next-action.md", '''# Next Action\n\n## Current Status\n\n`REPOSITORY_QUALITY_ASSET_IDENTITY_FIXED`\n\nThe full audit remains durable at `docs/knowledge/reviews/repository-quality-audit-2026-08-14.md`. RQ-05 and RQ-13 are mechanically closed: Production Assets uses distinct `PA-##` footer codes and stable semantic DOM IDs while accepted PRD Development identities remain unchanged. Browser visual proof for the visible footer-code change is still required before claiming refreshed visual PASS.\n\nAll still-open findings remain ordered in `docs/knowledge/operations/backlog.md`.\n\n## Next Step\n\nComplete **RQ-07 — retire the old Voice-only compositor path** while preserving only the Voice parsing/presentation primitives consumed by the objective-first Production Assets compositor.\n''')
          PY

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check

      - name: Regenerate Clockwork and verify identity mechanics
        run: |
          python kits/project-document-generator/renderer/delivery.py workspace/active/the-clockwork-vault
          python -m unittest tests.test_prd_voice_assets tests.test_prd_contracts -v
          python kits/project-document-generator/validator/validate.py workspace/active/the-clockwork-vault
          python kits/project-document-generator/validator/validate_handoff.py workspace/active/the-clockwork-vault
          python kits/voice-production-kit/validator/validate.py workspace/active/the-clockwork-vault
          python tools/verify_repository.py

      - name: Commit and self-delete workflow
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git rm .github/workflows/temp-rq05-rq13-asset-identity.yml
          git add -A
          git commit -m "fix: stabilize Production Assets identity"
          git push origin HEAD:Local
