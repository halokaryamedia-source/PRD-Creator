name: Clockwork Completion Regeneration

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/clockwork-completion-regen.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check

      - name: Add approved completion communication
        run: |
          cp workspace/active/the-clockwork-vault/output/v1.0.0/prd.html /tmp/clockwork-prd-before.html
          python - <<'PY'
          from pathlib import Path

          project = Path("workspace/active/the-clockwork-vault")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          def edit_section(text: str, start: str, end: str, editor, label: str) -> str:
              start_i = text.find(start)
              if start_i < 0:
                  raise RuntimeError(f"{label}: start section not found")
              end_i = text.find(end, start_i + len(start))
              if end_i < 0:
                  raise RuntimeError(f"{label}: end section not found")
              section = text[start_i:end_i]
              updated = editor(section)
              if updated == section:
                  raise RuntimeError(f"{label}: editor made no change")
              return text[:start_i] + updated + text[end_i:]

          # Voice requirements: add only the two missing completion transitions.
          req_path = project / "work/voice-requirements.md"
          req = req_path.read_text(encoding="utf-8")

          res_req = """### VO-RES-02 — The Engine Answers
          - Type: Main Story
          - Function: transition
          - Necessity: supporting
          - Speaker: Custodian Vex
          - Channel: Direct
          - Trigger: The Resonance Engine restores and the Broken Gallery route opens.
          - Flow: 04 — Engine Restored
          - Create: Create one short Custodian Vex completion line for this gameplay moment.
          - Used: Immediately after Objective 1 completes.
          - Moment: Resonance Engine Restored
          - Group: 04 — Completion
          - For: Acknowledge the restored Engine and point the player toward the Broken Gallery.
          - Purpose: Give Objective 1 a short story payoff and a clear handoff into the next room.
          - Must communicate:
            - The Resonance Engine is working again.
            - The Broken Gallery is now open/next.
          - Must not add/repeat:
            - Do not repeat the pillar combination, clue logic, or lever rules.
            - Do not mention validation, reset, state, or implementation language.
          - Source refs:
            - content.md → The Resonance Engine → Transition

          """
          gal_req = """### VO-GAL-03 — Across the Gallery
          - Type: Main Story
          - Function: transition
          - Necessity: supporting
          - Speaker: Custodian Vex
          - Channel: Direct
          - Trigger: The player clears the final Broken Gallery crossing and reaches the exit into the Warden Halls.
          - Flow: 06 — Gallery Cleared
          - Create: Create one short Custodian Vex completion line for this gameplay moment.
          - Used: Immediately after Objective 2 completes.
          - Moment: Broken Gallery Cleared
          - Group: 06 — Completion
          - For: Acknowledge the completed Gallery crossing and point the player toward the Warden Halls.
          - Purpose: Give Objective 2 a short success beat before the next room begins.
          - Must communicate:
            - The Broken Gallery crossing is complete/behind the player.
            - The Warden Halls are next.
          - Must not add/repeat:
            - Do not repeat resource, route, retry, or timer rules.
            - Do not explain Warden trap solutions before the player enters the next objective.
          - Source refs:
            - content.md → The Broken Gallery → Transition

          """

          req = replace_once(req, "## 03. The Broken Gallery\n", res_req + "## 03. The Broken Gallery\n", "insert VO-RES-02 requirements")
          req = replace_once(req, "## 04. The Warden Halls\n", gal_req + "## 04. The Warden Halls\n", "insert VO-GAL-03 requirements")
          req_path.write_text(req, encoding="utf-8")

          # Voice production: add two concise Vex lines and advance script version only.
          script_path = project / "work/voice-production.md"
          script = script_path.read_text(encoding="utf-8")
          script = replace_once(script, "Version: 1.4.0", "Version: 1.5.0", "voice production version")

          res_script = """### VO-RES-02 — The Engine Answers
          Type: Main Story
          Speaker: Custodian Vex
          Estimated Duration: 5–7 seconds

          ```performance
          [satisfied]
          That's it. The Engine remembers its tune.

          The Broken Gallery is open. Keep moving.
          ```

          """
          gal_script = """### VO-GAL-03 — Across the Gallery
          Type: Main Story
          Speaker: Custodian Vex
          Estimated Duration: 5–7 seconds

          ```performance
          [steady]
          You made it across. The Gallery is behind us.

          The Warden Halls are next. Stay sharp.
          ```

          """

          script = replace_once(script, "## 03. The Broken Gallery\n", res_script + "## 03. The Broken Gallery\n", "insert VO-RES-02 script")
          script = replace_once(script, "## 04. The Warden Halls\n", gal_script + "## 04. The Warden Halls\n", "insert VO-GAL-03 script")
          script_path.write_text(script, encoding="utf-8")

          # Non-Voice 04 source: add one exact completion UI per Objective 1–3.
          assets_path = project / "work/asset-requirements.md"
          assets = assets_path.read_text(encoding="utf-8")

          def edit_resonance(section: str) -> str:
              section = replace_once(
                  section,
                  "Uses: Resonance Engine restoration presentation; pillar completion feedback",
                  "Uses: Custodian Vex; Resonance Engine Restored Message; Resonance Engine restoration presentation; pillar completion feedback",
                  "Objective 1 completion uses",
              )
              ui = """#### Resonance Engine Restored Message
          Flow: 04 — Engine Restored
          Function: Confirms the Resonance Engine is restored and points the player to the Broken Gallery.
          Type: UI / TEXT
          Create: Create the exact player-facing Resonance Engine Restored Message.
          Used: When Objective 1 completes.
          Moment: Resonance Engine Restored
          Group: 04 — Engine Restored
          For: Confirm the successful restoration and make the next route obvious.
          Requirement: Keep the completion message short and in-world. Do not repeat the hidden combination or puzzle rules.
          Content:
          ```text
          ENGINE RESTORED

          The pillars are in tune again.
          The Broken Gallery is open.
          ```

          """
              return replace_once(section, "### Visual Effects & Presentation\n", ui + "### Visual Effects & Presentation\n", "Objective 1 completion UI")

          def edit_gallery(section: str) -> str:
              flow = """### Gameplay Flow 06 — Gallery Cleared
          For: Confirm the final crossing is complete and hand the player to the Warden Halls.
          Trigger: The player clears the final Gallery crossing and reaches the exit.
          Player Experience: The damaged Gallery is behind them, the next route is open, and Vex points them toward the Warden Halls.
          Uses: Custodian Vex; Gallery Cleared Message
          Done When:
          - The success response plays once after the final crossing is secured.
          - The completion message clearly names the Warden Halls as the next destination.
          - The player is not given any Warden trap solution before entering the next objective.

          """
              section = replace_once(section, "### UI & Information\n", flow + "### UI & Information\n", "Objective 2 completion flow")
              ui = """#### Gallery Cleared Message
          Flow: 06 — Gallery Cleared
          Function: Confirms the Broken Gallery is cleared and points the player to the Warden Halls.
          Type: UI / TEXT
          Create: Create the exact player-facing Gallery Cleared Message.
          Used: When Objective 2 completes.
          Moment: Broken Gallery Cleared
          Group: 06 — Gallery Cleared
          For: Confirm the successful crossing and make the next destination clear.
          Requirement: Keep the completion message short and in-world. Do not repeat route, resource, retry, or timer rules.
          Content:
          ```text
          GALLERY CLEARED

          The last crossing is behind you.
          The Warden Halls are ahead.
          ```

          """
              return replace_once(section, "#### Repair Gap Markers\n", ui + "#### Repair Gap Markers\n", "Objective 2 completion UI")

          def edit_warden(section: str) -> str:
              section = replace_once(
                  section,
                  "Uses: Custodian Vex; inner gate transition",
                  "Uses: Custodian Vex; Warden Halls Cleared Message; inner gate transition",
                  "Objective 3 completion uses",
              )
              ui = """#### Warden Halls Cleared Message
          Flow: 04 — Enter the Workshop
          Function: Confirms the Warden Halls are cleared and points the player to the Workshop.
          Type: UI / TEXT
          Create: Create the exact player-facing Warden Halls Cleared Message.
          Used: When Objective 3 completes.
          Moment: Warden Halls Cleared
          Group: 04 — Enter the Workshop
          For: Confirm the inner gate has opened and make the Workshop the clear next destination.
          Requirement: Keep the completion message short and in-world. Do not repeat Echo Pebble or hazard rules.
          Content:
          ```text
          WARDEN HALLS CLEARED

          The inner gate is open.
          The Workshop is next.
          ```

          """
              return replace_once(section, "### Visual Effects & Presentation\n", ui + "### Visual Effects & Presentation\n", "Objective 3 completion UI")

          assets = edit_section(assets, "## The Resonance Engine\n", "## The Broken Gallery\n", edit_resonance, "Objective 1 asset section")
          assets = edit_section(assets, "## The Broken Gallery\n", "## The Warden Halls\n", edit_gallery, "Objective 2 asset section")
          assets = edit_section(assets, "## The Warden Halls\n", "## The Gremlin's Workshop\n", edit_warden, "Objective 3 asset section")
          assets_path.write_text(assets, encoding="utf-8")
          PY

      - name: Regenerate consolidated PRD delivery
        run: python kits/project-document-generator/renderer/delivery.py workspace/active/the-clockwork-vault

      - name: Validate PRD and Voice
        run: |
          python kits/project-document-generator/validator/validate.py workspace/active/the-clockwork-vault
          python kits/voice-production-kit/validator/validate.py workspace/active/the-clockwork-vault

      - name: Prove 01–03 remained unchanged and completion assets exist
        run: |
          python - <<'PY'
          from pathlib import Path
          from lxml import html

          old = Path('/tmp/clockwork-prd-before.html').read_text(encoding='utf-8')
          new = Path('workspace/active/the-clockwork-vault/output/v1.0.0/prd.html').read_text(encoding='utf-8')

          def core_sections(source: str) -> list[bytes]:
              doc = html.fromstring(source)
              nodes = doc.xpath('//section[not(contains(concat(" ", normalize-space(@class), " "), " production-assets-page "))]')
              return [html.tostring(node, encoding='utf-8', method='html') for node in nodes]

          if core_sections(old) != core_sections(new):
              raise SystemExit('Protected 01–03 section bytes changed during downstream regeneration')

          required = [
              'ENGINE RESTORED',
              'The Broken Gallery is open.',
              'voice-prompt-vo-res-02',
              'GALLERY CLEARED',
              'The Warden Halls are ahead.',
              'voice-prompt-vo-gal-03',
              'WARDEN HALLS CLEARED',
              'The Workshop is next.',
          ]
          missing = [item for item in required if item not in new]
          if missing:
              raise SystemExit('Missing completion output: ' + ', '.join(missing))
          print('Protected 01–03 unchanged; five completion assets present.')
          PY
          git diff --exit-code HEAD -- workspace/active/the-clockwork-vault/work/content.md workspace/active/the-clockwork-vault/work/render-data.json

      - name: Commit canonical sources and regenerated delivery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/clockwork-completion-regen.yml
          git add \
            workspace/active/the-clockwork-vault/work/asset-requirements.md \
            workspace/active/the-clockwork-vault/work/voice-requirements.md \
            workspace/active/the-clockwork-vault/work/voice-production.md \
            workspace/active/the-clockwork-vault/output/README.md \
            workspace/active/the-clockwork-vault/output/v1.0.0/prd.html \
            workspace/active/the-clockwork-vault/output/v1.0.0/context.md \
            workspace/active/the-clockwork-vault/output/v1.0.0/index.json
          git commit -m "complete Clockwork objective transition assets"
          git push origin HEAD:Local
