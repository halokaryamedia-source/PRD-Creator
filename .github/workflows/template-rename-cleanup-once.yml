name: Finish Golden rename cleanup once

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/template-rename-cleanup-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean verification residue and restore historical evidence
        shell: bash
        run: |
          set -euo pipefail

          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          EOF

          # These are capture-time evidence bodies. Preserve the filenames they observed then.
          git show d1a15d26359b4d460919cc3fc8f761361d3a00b6:docs/knowledge/operations/archived-retirement-audit.md \
            > docs/knowledge/operations/archived-retirement-audit.md
          git show d1a15d26359b4d460919cc3fc8f761361d3a00b6:docs/knowledge/reviews/production-engineering-quality-audit.md \
            > docs/knowledge/reviews/production-engineering-quality-audit.md

          python - <<'PY'
          from pathlib import Path

          log = Path("docs/knowledge/decision-log.md")
          text = log.read_text(encoding="utf-8")
          text = text.replace(
              "Flow 3 must conserve every independently actionable material rule; Flow 4 requires `Material Conservation: PASS` separately from `Golden Fidelity: PASS` before new handoff.",
              "Flow 3 must conserve every independently actionable material rule; Flow 4 requires `Semantic Readiness: PASS` (including Golden Placement) plus `Material Conservation: PASS` before new handoff, while Visual sanity remains a separate evidence channel.",
          )
          log.write_text(text, encoding="utf-8")

          decision = Path("docs/knowledge/decisions/golden-reference-fidelity.md")
          text = decision.read_text(encoding="utf-8")
          text = text.replace(
              "Flow 4 therefore requires both:\n\n```text\nMaterial Conservation: PASS\nGolden Fidelity: PASS\n```\n\nbefore a new handoff can be accepted.",
              "Flow 4 therefore requires the current compact gates:\n\n```text\nSemantic Readiness: PASS   # includes Golden Placement\nMaterial Conservation: PASS\nVisual sanity: PASS | NOT PROVEN, according to actual evidence\n```\n\nCritical/Major findings still block handoff. Golden placement is evaluated inside Semantic Readiness instead of being persisted as a duplicate `Golden Fidelity` gate.",
          )
          text = text.replace(
              "- the initial 2026-08-12 split where `golden-reference.html` was exact but `runtime-template.html` could remain a separate cleaned runtime interpretation.",
              "- the initial 2026-08-12 split where the file then named `golden-sample.html` (now `golden-reference.html`) was exact but `approved-document.html` (now `runtime-template.html`) could remain a separate cleaned runtime interpretation.",
          )
          decision.write_text(text, encoding="utf-8")
          PY

          git diff --check

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check

      - name: Verify final tree
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_repository.py
          python -m unittest \
            tests.test_prd_contracts \
            tests.test_prd_handoff_contracts \
            tests.test_prd_flow2_state_contracts \
            tests.test_prd_hierarchy_contracts \
            tests.test_prd_golden_reference -v

          python kits/project-document-generator/renderer/render.py \
            workspace/active/the-clockwork-vault/work/render-data.json \
            /tmp/clockwork-final.html
          cmp /tmp/clockwork-final.html workspace/active/the-clockwork-vault/output/final.html
          test "$(sha256sum /tmp/clockwork-final.html | awk '{print $1}')" = \
               "0502e3cb78e5c834e540d9715d78cb3fbdf1f8519ab5b6a8c976c257a59d7024"
          test "$(git hash-object kits/project-document-generator/template/golden-reference.html)" = \
               "e1dccd77d7a5335213caea7a09d74ba78b2ae8e1"
          test "$(git hash-object kits/project-document-generator/template/runtime-template.html)" = \
               "e1dccd77d7a5335213caea7a09d74ba78b2ae8e1"

      - name: Commit final cleanup and remove bridge
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/template-rename-cleanup-once.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git add -A
          git commit -m "chore: finish Golden template rename cleanup"
          git push origin HEAD:Local
