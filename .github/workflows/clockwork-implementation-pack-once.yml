name: Clockwork Implementation Pack Once

on:
  push:
    branches: [Local]
    paths:
      - ".tmp-implementation-pack/READY"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check
      - name: Apply implementation-pack metadata
        run: python .tmp-implementation-pack/patch.py
      - name: Compile and contract-test
        run: |
          python -m compileall -q kits/project-document-generator/renderer kits/voice-production-kit
          python -m unittest tests.test_voice_contracts -v
      - name: Rerender Clockwork
        run: python kits/project-document-generator/renderer/delivery.py workspace/active/the-clockwork-vault/
      - name: Validate PRD and Voice
        run: |
          python kits/project-document-generator/validator/validate.py workspace/active/the-clockwork-vault/
          python kits/project-document-generator/validator/validate_handoff.py workspace/active/the-clockwork-vault/
          python kits/voice-production-kit/validator/validate.py workspace/active/the-clockwork-vault/
      - name: Verify implementation-pack UX
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('workspace/active/the-clockwork-vault/output/v1.0.0/prd.html').read_text(encoding='utf-8')
          required = [
              'Player Goal', 'Completion', 'Trigger', 'Player Experience',
              'Implementation Checklist', 'Purpose', 'Use / Trigger', 'Done When',
              'class="pa-flow-nav"', 'Copy Text', 'Copy Prompt',
              '03 — Route Swap Sabotage', '04 — 50% Rollback', '05 — 80% Rollback',
              'The Cheeky Trickster'
          ]
          for token in required:
              assert token in html, token
          forbidden = [
              'Copy Flow Text',
              'implementation items',
              'copy-ready texts',
              '<h3>UI &amp; Information</h3>',
              '<h3>Audio</h3>',
              '<h3>Visual Effects &amp; Presentation</h3>',
              '<div class="pa-card-number">',
          ]
          for token in forbidden:
              assert token not in html, token
          print('developer implementation-pack UX PASS')
          PY
      - name: Update next action
        run: |
          cat > docs/knowledge/next-action.md <<'EOF'
          # Next Action

          ## Current Status

          `CLOCKWORK_IMPLEMENTATION_PACK_READY`

          The Clockwork v1.0.0 PRD remains handoff-ready and Voice remains delivery-ready. Production Assets now works as a gameplay-flow implementation pack rather than an asset catalog. Each flow provides Trigger, Player Experience, reusable dependencies, an Implementation Checklist, direct asset purpose/use, exact copy-ready player text and Voice prompts, and Done When. Quick Jump is retained. Asset-count summaries, asset numbering, category-first grouping, and Copy Flow Text are removed from the primary developer experience.

          The current HTML has passed PRD, handoff, Voice, and implementation-pack structural validation. Browser-level visual quality is still not claimed until visual review.

          ## Next Step

          Review the regenerated Production Assets pages visually in-browser. If the structure is accepted, continue only with any visual polish findings or actual ElevenLabs generation/audio review.
          EOF
      - name: Cleanup one-shot tooling
        run: |
          rm -rf .tmp-implementation-pack
          rm -f .github/workflows/clockwork-implementation-pack-once.yml
      - name: Commit implementation pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "make Production Assets developer implementation packs"
          git push origin HEAD:Local
