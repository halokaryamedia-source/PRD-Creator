name: Clockwork Gremlin Voice Once

on:
  push:
    branches: [Local]
    paths:
      - ".tmp-gremlin-voice/READY"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check
      - name: Set Voice validation state
        run: |
          PROJECT=workspace/active/the-clockwork-vault
          cat > "$PROJECT/state/voice-state.yaml" <<'EOF'
          flow: 7
          status: voice_validation
          source_handoff: state/handoff-state.yaml
          source_prd_revision: 1.0.0
          canonical_prd: work/content.md
          requirements: work/voice-requirements.md
          requirements_status: current
          script: work/voice-production.md
          script_status: current_pending_validation
          project_html: output/v1.0.0/prd.html
          project_html_status: pending_voice_rerender
          acceptance: work/voice-acceptance.md
          unresolved_upstream: 0
          mechanical: pending
          voice_script_readiness: pending
          communication_conservation: pending
          project_html_visual: NOT_PROVEN
          audio_evidence: not_provided
          next_step: validate_gremlin_voice_revision
          EOF
      - name: Rerender project HTML
        run: |
          python kits/project-document-generator/renderer/delivery.py workspace/active/the-clockwork-vault/
      - name: Validate PRD and Voice
        run: |
          python kits/project-document-generator/validator/validate.py workspace/active/the-clockwork-vault/
          python kits/project-document-generator/validator/validate_handoff.py workspace/active/the-clockwork-vault/
          python kits/voice-production-kit/validator/validate.py workspace/active/the-clockwork-vault/
      - name: Mark Voice ready
        run: |
          PROJECT=workspace/active/the-clockwork-vault
          cat > "$PROJECT/work/voice-acceptance.md" <<'EOF'
          # Voice Acceptance
          Status: voice_delivery_ready
          Mechanical: PASS
          Voice Script Readiness: PASS
          Communication Conservation: PASS
          Project HTML Visual: NOT PROVEN
          Audio Evidence: not_provided
          Critical: 0
          Major: 0
          EOF
          cat > "$PROJECT/state/voice-state.yaml" <<'EOF'
          flow: 7
          status: voice_delivery_ready
          source_handoff: state/handoff-state.yaml
          source_prd_revision: 1.0.0
          canonical_prd: work/content.md
          requirements: work/voice-requirements.md
          requirements_status: current
          script: work/voice-production.md
          script_status: current
          project_html: output/v1.0.0/prd.html
          project_html_status: current_with_voice
          acceptance: work/voice-acceptance.md
          unresolved_upstream: 0
          mechanical: PASS
          voice_script_readiness: PASS
          communication_conservation: PASS
          project_html_visual: NOT_PROVEN
          audio_evidence: not_provided
          gremlin_voice_selection: pending_actual_elevenlabs_voice
          next_step: select_gremlin_voice_then_optional_generation_mode
          EOF
          cat > docs/knowledge/next-action.md <<'EOF'
          # Next Action

          ## Current Status

          `CLOCKWORK_GREMLIN_VOICE_READY`

          The Clockwork PRD remains handoff-ready. Voice Production now contains 17 current lines: Custodian Vex remains the primary guide and Gremlin has four short Objective 4 taunts for route swap, 50-percent rollback, 80-percent rollback, and the final outsmarted reaction. The Gremlin lines add character only and do not replace Vex gameplay guidance.

          Gremlin has a prepared Target Voice Profile but no actual ElevenLabs voice has been selected yet. Audio evidence remains not provided.

          ## Next Step

          Select an actual ElevenLabs voice for Gremlin before Generation Mode, then generate/review takes if audio production is requested.
          EOF
      - name: Cleanup one-shot tooling
        run: |
          rm -rf .tmp-gremlin-voice
          rm -f .github/workflows/clockwork-gremlin-voice-once.yml
      - name: Commit finalized Gremlin Voice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "add Gremlin Voice production"
          git push origin HEAD:Local
