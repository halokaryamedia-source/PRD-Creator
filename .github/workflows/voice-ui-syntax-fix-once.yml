name: Voice UI Syntax Fix Once

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/voice-ui-syntax-fix-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fix exact renderer syntax defect
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('kits/project-document-generator/renderer/production_assets.py')
          text = path.read_text(encoding='utf-8')
          old = '        f\'<div class="voice-page-setup-rows>{"".join(rows)}</div>\'\n'
          # Match the actual malformed line without relying on nested quote escaping.
          lines = text.splitlines()
          target = '        f\'<div class="voice-page-setup-rows>{"".join(rows)}</div>\''
          replaced = False
          for index, line in enumerate(lines):
              if 'voice-page-setup-rows' in line and 'join(rows)' in line:
                  lines[index] = '        \'<div class="voice-page-setup-rows">\' + "".join(rows) + \'</div>\''
                  replaced = True
                  break
          if not replaced:
              raise SystemExit('target malformed line not found')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Compile and run focused contracts
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m compileall -q kits/project-document-generator tests/test_prd_voice_assets.py
          python -m unittest tests.test_prd_voice_assets -v

      - name: Commit fix and remove workflow
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git rm .github/workflows/voice-ui-syntax-fix-once.yml
          git add kits/project-document-generator/renderer/production_assets.py
          git commit -m "fix: compile Voice production renderer"
          git push origin HEAD:Local
