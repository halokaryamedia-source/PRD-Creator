name: Clockwork Preview Artifact Once

on:
  push:
    branches: [Local]
    paths:
      - ".tmp-preview-artifact/READY"

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
      - uses: actions/upload-artifact@v4
        with:
          name: The-Clockwork-Vault-PRD-v1.0.0-Final
          path: workspace/active/the-clockwork-vault/output/v1.0.0/prd.html
          if-no-files-found: error
      - name: Cleanup one-shot tooling
        run: |
          rm -rf .tmp-preview-artifact
          rm -f .github/workflows/clockwork-preview-artifact-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "cleanup Clockwork preview exporter"
          git push origin HEAD:Local
