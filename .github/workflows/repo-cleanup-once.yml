name: Repository cleanup once

on:
  push:
    branches: [Local]
    paths:
      - .github/workflows/repo-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete obsolete branch refs
        run: |
          git push origin --delete \
            __cleanup_marker_only__ \
            __do_not_create_more__ \
            __flow5-temp-check \
            __invalid_should_not_create__ \
            __invalid_should_not_create__2 \
            __invalid_should_not_create__3 \
            agent/flow-1-repository-foundation

      - name: Remove one-time workflow
        run: |
          rm .github/workflows/repo-cleanup-once.yml
          git config user.name halokaryamedia-source
          git config user.email halokaryamedia@gmail.com
          git add -u .github/workflows/repo-cleanup-once.yml
          git commit -m "chore: finish repository cleanup"
          git push origin HEAD:Local
