name: Repository Verify

on:
  push:
    branches:
      - develop
      - Local
    paths:
      - "AGENTS.md"
      - "GITHUB_RULES.md"
      - "CONTEXT.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".github/CODEOWNERS"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/**"
      - ".agents/skills/**"
      - "docs/foundation/**"
      - "docs/knowledge/README.md"
      - "docs/knowledge/next-action.md"
      - "docs/knowledge/work-routing.md"
      - "docs/knowledge/ownership.md"
      - "docs/knowledge/source-authority.md"
      - "docs/knowledge/work-modes/**"
      - "docs/knowledge/skills/**"
      - "docs/knowledge/decisions/**"
      - "docs/knowledge/reviews/README.md"
      - "docs/knowledge/reviews/current-validation.md"
      - "docs/knowledge/operations/**"
      - "kits/prd-creator/README.md"
      - "kits/prd-creator/AGENTS.md"
      - "kits/prd-creator/SKILL.md"
      - "kits/prd-creator/intake/**"
      - "kits/prd-creator/document/**"
      - "kits/prd-creator/production-assets/**"
      - "kits/prd-creator/renderer/**"
      - "kits/prd-creator/shared/**"
      - "kits/prd-creator/validator/**"
      - "kits/prd-creator/voice/**"
      - "workspace/README.md"
      - "workspace/active/README.md"
      - "workspace/archive/README.md"
      - "tools/**/*.py"
      - "requirements.lock.txt"
      - "requirements-dev.lock.txt"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Static repository contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify governance surfaces
        run: |
          required=(
            "README.md"
            "CONTRIBUTING.md"
            "CHANGELOG.md"
            "SECURITY.md"
            ".gitignore"
            ".gitattributes"
            ".github/CODEOWNERS"
            ".github/PULL_REQUEST_TEMPLATE.md"
            ".github/workflows/local-promotion-verify.yml"
            ".github/workflows/release-verify.yml"
          )
          for path in "${required[@]}"; do
            test -f "$path" || {
              echo "Missing required governance surface: $path" >&2
              exit 1
            }
          done

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify repository
        run: python tools/verify_repository.py
