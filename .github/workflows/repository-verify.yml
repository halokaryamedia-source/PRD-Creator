name: Repository Verify

on:
  push:
    branches:
      - Local
  pull_request:
    branches:
      - Local
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Static repository contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify repository
        run: python tools/verify_repository.py
