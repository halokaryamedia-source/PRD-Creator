name: Repository Verify

on:
  push:
    branches:
      - Local
    paths:
      - "AGENTS.md"
      - "GITHUB_RULES.md"
      - "CONTEXT.md"
      - "README.md"
      - ".agents/skills/**"
      - "docs/foundation/**"
      - "docs/knowledge/**"
      - "kits/prd-creator/**/*.md"
      - "kits/prd-creator/voice/LICENSE"
      - "workspace/README.md"
      - "workspace/archive/README.md"
      - "requirements.lock.txt"
      - "tools/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - Local
      - main
    paths:
      - "AGENTS.md"
      - "GITHUB_RULES.md"
      - "CONTEXT.md"
      - "README.md"
      - ".agents/skills/**"
      - "docs/foundation/**"
      - "docs/knowledge/**"
      - "kits/prd-creator/**/*.md"
      - "kits/prd-creator/voice/LICENSE"
      - "workspace/README.md"
      - "workspace/archive/README.md"
      - "requirements.lock.txt"
      - "tools/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Static repository contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify repository
        run: python tools/verify_repository.py
