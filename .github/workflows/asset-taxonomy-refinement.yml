name: Production Assets Taxonomy Refinement

on:
  push:
    branches: [Local]
    paths: [".github/workflows/asset-taxonomy-refinement.yml"]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check

      - name: Apply final taxonomy
        run: |
          perl -pi -e 's/Cinematic & Presentation/Visual Effects & Presentation/g' CONTEXT.md README.md kits/project-document-generator/README.md kits/project-document-generator/RENDERING.md kits/project-document-generator/renderer/production_assets_objective.py workspace/README.md docs/knowledge/reviews/current-validation.md docs/knowledge/next-action.md tests/test_prd_voice_assets.py
          python -c "from pathlib import Path; p=Path('tests/test_prd_voice_assets.py'); t=p.read_text(encoding='utf-8'); fence=chr(96)*3; needle='TRIAL COMPLETE\\n'+fence+'\\n\"\"\"'; repl='TRIAL COMPLETE\\n'+fence+'\\n\\n### Visual Effects & Presentation\\n\\n#### Trial Completion Reveal\\nRequirement: Create one short objective-completion presentation with a brief area-wide visual pulse and camera emphasis. It is a standalone presentation response, not a component of the console or hologram assets.\\nUsage: Runs once after valid trial completion.\\n\"\"\"'; assert t.count(needle)==1; t=t.replace(needle,repl,1); zero='        self.assertNotIn(\"Cinematic &amp; Presentation <b>0</b>\", html)\\n'; pos='        self.assertIn(\"Visual Effects &amp; Presentation <b>1</b>\", html)\\n        self.assertNotIn(\"Cinematic &amp; Presentation\", html)\\n'; assert t.count(zero)==1; p.write_text(t.replace(zero,pos,1),encoding='utf-8')"
          grep -F 'ASSET_CATEGORIES = ("3D Models", "UI & Information", "Audio", "Visual Effects & Presentation")' kits/project-document-generator/renderer/production_assets_objective.py

      - name: Run focused contracts
        run: |
          python -m compileall -q kits/project-document-generator/renderer kits/voice-production-kit tests/test_prd_voice_assets.py tests/test_voice_contracts.py
          python -m unittest tests.test_prd_voice_assets -v
          python -m unittest tests.test_voice_contracts -v

      - name: Commit and self-delete
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          rm .github/workflows/asset-taxonomy-refinement.yml
          git add -A
          git commit -m "prd: finalize Production Assets taxonomy"
          git push origin HEAD:Local
