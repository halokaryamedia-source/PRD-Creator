name: Clockwork Production Assets Minimal Once

on:
  push:
    branches: [Local]
    paths:
      - ".tmp-pa-minimal/READY"

permissions:
  contents: write

env:
  PROJECT: workspace/active/the-clockwork-vault

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check

      - name: Apply concise Production Assets patch
        run: |
          python .tmp-pa-minimal/fix.py
          python .tmp-pa-minimal/patch.py

      - name: Compile and contract-test
        run: |
          python -m compileall -q kits/project-document-generator/renderer kits/voice-production-kit
          python -m unittest tests.test_voice_contracts -v

      - name: Rerender Clockwork
        run: python kits/project-document-generator/renderer/delivery.py "$PROJECT/"

      - name: Validate PRD and Voice
        run: |
          python kits/project-document-generator/validator/validate.py "$PROJECT/"
          python kits/project-document-generator/validator/validate_handoff.py "$PROJECT/"
          python kits/voice-production-kit/validator/validate.py "$PROJECT/"

      - name: Verify concise Production Assets UX
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('workspace/active/the-clockwork-vault/output/v1.0.0/prd.html').read_text(encoding='utf-8')
          required = [
              'class="pa-flow-nav"',
              'class="pa-for"',
              '>For</span>',
              'Copy Text',
              'Copy Prompt',
              'View Text',
              'The Cheeky Trickster',
              'See 03 Development for mechanic and implementation details.',
          ]
          for token in required:
              assert token in html, token
          forbidden = [
              'Copy Flow Text',
              'Implementation Checklist',
              '<h4>Done When</h4>',
              '<span>Player Experience</span>',
              '<span>Trigger</span>',
              '<span>Player Goal</span>',
              '<span>Completion</span>',
          ]
          for token in forbidden:
              assert token not in html, token
          print('concise Production Assets UX PASS')
          PY

      - name: Update next action
        run: |
          cat > docs/knowledge/next-action.md <<'EOF'
          # Next Action

          ## Current Status

          `CLOCKWORK_PRODUCTION_ASSETS_CONCISE_READY`

          The Clockwork v1.0.0 PRD remains handoff-ready and Voice remains delivery-ready. Production Assets is now a concise gameplay-flow companion to Development: each flow shows only a short For statement, then the required assets with a short purpose statement. Exact player text and Voice prompts remain directly copyable. Quick Jump remains; duplicated mechanic context, Trigger, Player Experience, Implementation Checklist, Done When, asset counts, numbering, category-first grouping, and Copy Flow Text are not shown.

          The current HTML has passed PRD, handoff, Voice, and concise Production Assets structural validation. Browser-level visual quality is still not claimed until visual review.

          ## Next Step

          Review the concise Production Assets pages visually in-browser. Continue only with specific visual polish findings or actual ElevenLabs generation/audio review.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: The-Clockwork-Vault-PRD-v1.0.0-Concise-Assets
          path: workspace/active/the-clockwork-vault/output/v1.0.0/prd.html
          if-no-files-found: error

      - name: Cleanup one-shot tooling
        run: |
          rm -rf .tmp-pa-minimal
          rm -f .github/workflows/clockwork-pa-minimal-once.yml

      - name: Commit concise Production Assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "simplify Production Assets for developer use"
          git push origin HEAD:Local
