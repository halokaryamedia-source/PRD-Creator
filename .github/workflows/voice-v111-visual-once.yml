name: Voice v1.11 Visual Once

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/voice-v111-visual-once.yml"

permissions:
  contents: write

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium==4.35.0

      - name: Capture isolated Voice pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import time

          html = Path('workspace/active/the-clockwork-vault/output/final.html').resolve().as_uri()
          out = Path('visual-review')
          out.mkdir()

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--hide-scrollbars')
          options.add_argument('--window-size=1600,1200')

          driver = webdriver.Chrome(options=options)
          try:
              driver.get(html)
              driver.set_window_size(1600, 1200)
              targets = [
                  ('01-antechamber.png', 'production-assets-voice-1'),
                  ('02-workshop.png', 'production-assets-voice-5'),
                  ('03-ending.png', 'production-assets-voice-6'),
              ]
              for filename, target_id in targets:
                  driver.execute_script("""
                    const targetId = arguments[0];
                    document.body.classList.remove('view-clean');
                    document.body.classList.add('view-professional');
                    document.querySelectorAll('main.document-main > section.sheet').forEach(function(el){
                      el.style.setProperty('display','none','important');
                    });
                    const target = document.getElementById(targetId);
                    target.style.setProperty('display','block','important');
                    target.style.setProperty('margin-top','0','important');
                    window.scrollTo(0,0);
                  """, target_id)
                  time.sleep(0.2)
                  driver.save_screenshot(str(out / filename))
          finally:
              driver.quit()
          PY

      - name: Upload visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-v111-visual-review
          path: visual-review/*.png
          if-no-files-found: error
          retention-days: 1

      - name: Remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/voice-v111-visual-once.yml
          git commit -m "chore: remove Voice v1.11 visual workflow"
          git push origin HEAD:Local
