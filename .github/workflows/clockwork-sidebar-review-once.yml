name: Clockwork Sidebar Review Once

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/clockwork-sidebar-review-once.yml"

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install review dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip install --disable-pip-version-check selenium==4.35.0

      - name: Render Clockwork and validate Voice
        run: |
          python kits/project-document-generator/renderer/render.py \
            workspace/active/the-clockwork-vault/work/render-data.json \
            workspace/active/the-clockwork-vault/output/final.html
          python kits/voice-production-kit/validator/validate.py \
            workspace/active/the-clockwork-vault/

      - name: Assert hierarchy and Voice labels
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('workspace/active/the-clockwork-vault/output/final.html').read_text(encoding='utf-8')
          required = [
              'class="nav-submenu phase-navigation"',
              'class="nav-group is-open professional-nav production-assets-nav"',
              'class="production-assets-category"',
              'data-full-index="04" data-overview-index="">04</span>',
              'The Antechamber', 'Introduction',
              'The Resonance Engine', 'Objective 1',
              'The Broken Gallery', 'Objective 2',
              'The Warden Halls', 'Objective 3',
              'The Gremlin’s Workshop', 'Objective 4',
              'Vault Restored', 'Ending',
          ]
          for value in required:
              if value not in html:
                  raise SystemExit(f'missing rendered contract: {value}')
          if 'production-objective-nav' in html:
              raise SystemExit('gameplay packages were promoted out of Development')
          if html.count('class="production-assets-category"') != 1:
              raise SystemExit('Voice category must appear exactly once')
          if html.count('data-target="production-assets-voice-') != 6:
              raise SystemExit('expected six Clockwork Voice navigation links')
          if 'class="voice-objective-title">05.' in html:
              raise SystemExit('Voice page borrowed synthetic PRD navigation number')
          PY

      - name: Browser-check sidebar fit
        run: |
          mkdir -p /tmp/clockwork-sidebar-review
          python - <<'PY'
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          expected = [
              ('The Antechamber', 'Introduction'),
              ('The Resonance Engine', 'Objective 1'),
              ('The Broken Gallery', 'Objective 2'),
              ('The Warden Halls', 'Objective 3'),
              ('The Gremlin’s Workshop', 'Objective 4'),
              ('Vault Restored', 'Ending'),
          ]
          html = Path('workspace/active/the-clockwork-vault/output/final.html').resolve()
          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          driver = webdriver.Chrome(options=options)
          try:
              for width in (1500, 900):
                  driver.set_window_size(width, 1200)
                  driver.get(html.as_uri())
                  driver.execute_script("localStorage.clear(); document.body.classList.remove('view-clean'); document.body.classList.add('view-professional');")
                  links = driver.find_elements(By.CSS_SELECTOR, '.production-assets-nav .nav-submenu a')
                  if len(links) != len(expected):
                      raise SystemExit(f'{width}px: expected {len(expected)} Voice links, got {len(links)}')
                  actual = []
                  for link in links:
                      name = link.find_element(By.CSS_SELECTOR, '.production-assets-objective-name')
                      label = link.find_element(By.CSS_SELECTOR, 'small')
                      actual.append((name.text.strip(), label.text.strip()))
                      overflow = driver.execute_script(
                          "return arguments[0].scrollWidth > arguments[0].clientWidth + 1 || arguments[0].scrollHeight > arguments[0].clientHeight + 1;",
                          link,
                      )
                      if overflow:
                          raise SystemExit(f'{width}px: clipped Voice nav text: {name.text} / {label.text}')
                  if actual != expected:
                      raise SystemExit(f'{width}px: Voice labels differ: {actual!r}')
                  target = driver.find_element(By.CSS_SELECTOR, '.production-assets-nav')
                  driver.execute_script("arguments[0].scrollIntoView({block:'center'});", target)
                  driver.save_screenshot(f'/tmp/clockwork-sidebar-review/sidebar-{width}.png')
          finally:
              driver.quit()
          PY

      - name: Upload review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: clockwork-sidebar-review
          path: /tmp/clockwork-sidebar-review/*.png
          retention-days: 1

      - name: Commit rendered HTML and remove review workflow
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git rm .github/workflows/clockwork-sidebar-review-once.yml
          git add workspace/active/the-clockwork-vault/output/final.html
          git commit -m "render: restore Clockwork sidebar hierarchy"
          git push origin HEAD:Local
