name: Clarify Golden template names once

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/template-rename-once.yml"

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rename template paths and references
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import subprocess

          old_golden = "golden-sample.html"
          new_golden = "golden-reference.html"
          old_runtime = "approved-document.html"
          new_runtime = "runtime-template.html"

          result = subprocess.run(
              ["git", "grep", "-Il", "-e", old_golden, "-e", old_runtime, "--", ":!.github/workflows/template-rename-once.yml"],
              check=False,
              capture_output=True,
              text=True,
          )
          paths = [Path(line) for line in result.stdout.splitlines() if line.strip()]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              text = text.replace(old_golden, new_golden).replace(old_runtime, new_runtime)
              if path.as_posix() == "tests/test_prd_contracts.py":
                  text = text.replace("APPROVED_TEMPLATE", "RUNTIME_TEMPLATE")
              if path.as_posix() == "kits/project-document-generator/GLOSSARY.md":
                  text = text.replace("| Approved PRD Template |", "| Runtime PRD Template |")
              path.write_text(text, encoding="utf-8")
          PY

          git mv kits/project-document-generator/template/golden-sample.html \
                 kits/project-document-generator/template/golden-reference.html
          git mv kits/project-document-generator/template/approved-document.html \
                 kits/project-document-generator/template/runtime-template.html

          test "$(git hash-object kits/project-document-generator/template/golden-reference.html)" = \
               "$(git hash-object kits/project-document-generator/template/runtime-template.html)"
          test "$(git hash-object kits/project-document-generator/template/golden-reference.html)" = \
               "e1dccd77d7a5335213caea7a09d74ba78b2ae8e1"

          if git grep -n -e 'golden-sample.html' -e 'approved-document.html' -- ':!.github/workflows/template-rename-once.yml'; then
            echo "Old template filename reference remains" >&2
            exit 1
          fi

          git diff --check

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check

      - name: Verify repository and PRD contracts
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_repository.py
          python -m compileall -q kits/project-document-generator \
            tests/test_prd_contracts.py \
            tests/test_prd_handoff_contracts.py \
            tests/test_prd_flow2_state_contracts.py \
            tests/test_prd_hierarchy_contracts.py \
            tests/test_prd_golden_reference.py
          python -m unittest \
            tests.test_prd_contracts \
            tests.test_prd_handoff_contracts \
            tests.test_prd_flow2_state_contracts \
            tests.test_prd_hierarchy_contracts \
            tests.test_prd_golden_reference -v

      - name: Prove Clockwork output unchanged
        shell: bash
        run: |
          set -euo pipefail
          python kits/project-document-generator/renderer/render.py \
            workspace/active/the-clockwork-vault/work/render-data.json \
            /tmp/clockwork-final.html
          cmp /tmp/clockwork-final.html workspace/active/the-clockwork-vault/output/final.html
          test "$(sha256sum /tmp/clockwork-final.html | awk '{print $1}')" = \
               "0502e3cb78e5c834e540d9715d78cb3fbdf1f8519ab5b6a8c976c257a59d7024"

      - name: Commit rename and remove bridge
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/template-rename-once.yml
          git diff --check
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git add -A
          git commit -m "refactor: clarify Golden template names"
          git push origin HEAD:Local
