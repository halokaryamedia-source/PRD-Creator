name: Clockwork 04 Label Fix Once

on:
  push:
    branches: [Local]
    paths:
      - ".tmp-clockwork-04-label-fix/READY"

permissions:
  contents: write

env:
  PROJECT: workspace/active/the-clockwork-vault

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check
      - name: Apply scoped fix
        run: python .tmp-clockwork-04-label-fix/fix.py
      - name: Rerender
        run: python kits/project-document-generator/renderer/delivery.py "$PROJECT/"
      - name: Validate
        run: |
          python kits/project-document-generator/validator/validate.py "$PROJECT/"
          python kits/project-document-generator/validator/validate_handoff.py "$PROJECT/"
          python kits/voice-production-kit/validator/validate.py "$PROJECT/"
      - name: Verify labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('workspace/active/the-clockwork-vault')
          src = (p/'work/asset-requirements.md').read_text(encoding='utf-8')
          html = (p/'output/v1.0.0/prd.html').read_text(encoding='utf-8')
          r0 = src.index('## The Resonance Engine')
          r1 = src.index('## The Broken Gallery', r0)
          resonance = src[r0:r1]
          assert '04 — Engine Restored' in resonance
          assert '04 — Enter the Workshop' not in resonance
          assert 'Valid Placement Markers' not in src
          assert '04 — Engine Restored' in html
          print('scoped Production Assets label verification PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: The-Clockwork-Vault-PRD-v1.0.0-04-Final
          path: workspace/active/the-clockwork-vault/output/v1.0.0/prd.html
          if-no-files-found: error
      - name: Cleanup one-shot tooling
        run: |
          rm -rf .tmp-clockwork-04-label-fix
          rm -f .github/workflows/clockwork-04-label-fix-once.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix scoped Production Assets flow label"
          git push origin HEAD:Local
