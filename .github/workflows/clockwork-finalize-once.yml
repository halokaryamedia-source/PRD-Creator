name: Clockwork Finalize Once

on:
  push:
    branches: [Local]
    paths:
      - ".tmp-clockwork/READY"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check

      - name: Reconstruct exact render data
        run: |
          cat .tmp-clockwork/part*.b64 | base64 -d | xz -d > workspace/active/the-clockwork-vault/work/render-data.json
          test "$(git hash-object workspace/active/the-clockwork-vault/work/render-data.json)" = "e78565f40a4ddd85532c2042a8e43aaf6d26d8ec"

      - name: Prepare handoff state for delivery
        run: |
          cat > workspace/active/the-clockwork-vault/work/acceptance.md <<'EOF'
          # PRD Acceptance
          Status: handoff_ready
          Mechanical: PASS
          Semantic Readiness: PASS
          Material Conservation: PASS
          Visual sanity: NOT PROVEN
          Critical: 0
          Major: 0
          EOF
          cat > workspace/active/the-clockwork-vault/state/handoff-state.yaml <<'EOF'
          project: the-clockwork-vault
          status: handoff_ready
          accepted_prd_version: 1.0.0
          baseline_handoff: revised_and_revalidated
          content: work/content.md
          content_status: current
          render_data: work/render-data.json
          render_data_status: current
          html: output/v1.0.0/prd.html
          html_status: current
          context: output/v1.0.0/context.md
          context_status: current
          index: output/v1.0.0/index.json
          index_status: current
          acceptance: work/acceptance.md
          handoff: output/README.md
          revision_review: work/review.md
          revision_review_status: approved
          asset_requirements: work/asset-requirements.md
          asset_requirements_status: current
          next_step: revise_voice_from_current_prd_handoff
          EOF

      - name: Render current PRD without stale Voice
        run: |
          PROJECT=workspace/active/the-clockwork-vault
          mkdir -p /tmp/clockwork-voice
          for f in voice-production.md voice-requirements.md; do
            if [ -f "$PROJECT/work/$f" ]; then mv "$PROJECT/work/$f" "/tmp/clockwork-voice/$f"; fi
          done
          python kits/project-document-generator/renderer/delivery.py "$PROJECT"
          for f in /tmp/clockwork-voice/*; do
            [ -e "$f" ] && mv "$f" "$PROJECT/work/"
          done

      - name: Validate PRD and handoff
        run: |
          PROJECT=workspace/active/the-clockwork-vault
          python kits/project-document-generator/validator/validate.py "$PROJECT"
          python kits/project-document-generator/validator/validate_handoff.py "$PROJECT"

      - name: Advance Voice and next-action state
        run: |
          cat > workspace/active/the-clockwork-vault/state/voice-state.yaml <<'EOF'
          flow: 5
          status: ready_for_revision
          source_handoff: state/handoff-state.yaml
          source_prd_revision: 1.0.0
          requirements: work/voice-requirements.md
          requirements_status: stale_for_current_gameplay_revision
          script: work/voice-production.md
          script_status: stale_for_current_gameplay_revision
          project_html: output/v1.0.0/prd.html
          project_html_status: current_prd_without_revised_voice
          acceptance: work/voice-acceptance.md
          unresolved_upstream: 0
          mechanical: pending_voice_revision
          coverage: pending_voice_revision
          terminology_pronunciation: pending_voice_revision
          speaker_channel_trigger: pending_voice_revision
          performance_continuity: pending_voice_revision
          project_html_visual: pending_voice_revision
          audio_evidence: not_provided
          delivery_scope: revise_affected_voice_scope_from_current_prd
          next_step: revise_voice_requirements_and_voice_production
          EOF
          cat > docs/knowledge/next-action.md <<'EOF'
          # Next Action

          ## Current Status

          `CLOCKWORK_PRD_HANDOFF_READY`

          The approved Clockwork gameplay revision for Objectives 1-4 has been projected into the current v1.0.0 delivery bundle and mechanically validated. Objective 1 uses the approved partial-display clue model: Middle = Brown is shown, twelve scattered books use 2 rule + 8 useful clue + 2 harmless decoy structure, and the hidden completion state is Left Orange + pulse, Middle Brown + steady, Right Purple + steady. Objective 4 technical coordinates remain outside the PRD.

          The non-Voice Production Assets are current. Existing Voice canonical files are intentionally still marked stale because they describe the previous gameplay revision and were excluded from this PRD render.

          ## Next Step

          Revise the affected Voice requirements and Voice Production from the current handoff-ready PRD, validate Voice, then rerender the same v1.0.0 project HTML with the revised Voice Production Assets included.
          EOF

      - name: Remove one-shot transfer files and workflow
        run: |
          rm -rf .tmp-clockwork
          rm -f .github/workflows/clockwork-finalize-once.yml

      - name: Commit finalized Clockwork delivery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "finalize Clockwork PRD gameplay revision"
          git push origin HEAD:Local
