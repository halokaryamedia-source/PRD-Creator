name: Clockwork Finalize Once

on:
  push:
    branches: [Local]
    paths:
      - ".tmp-clockwork/READY"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check

      - name: Clean approved project-facing wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('workspace/active/the-clockwork-vault/work/content.md')
          s=p.read_text(encoding='utf-8')
          replacements={
            'The Workshop contains the Power Generator, three Great Orrery rings, and an authored network of power paths controlled by 90-degree L-shaped rotator junctions. The exact coordinate grid and route layout belong to a separate technical support document and are not part of the PRD.':'The Workshop contains the Power Generator, three Great Orrery rings, and an authored network of power paths controlled by 90-degree L-shaped rotator junctions.',
            '**Context:** The Workshop contains the Power Generator, three Great Orrery rings, and an authored power-routing field of 90-degree L rotators. The exact coordinate layout is maintained separately as technical support rather than embedded in the PRD.':'**Context:** The Workshop contains the Power Generator, three Great Orrery rings, and an authored power-routing field of 90-degree L rotators.',
            'Build a readable Workshop around the authored routing topology without reproducing technical grid coordinates in the PRD. Generator, live power, Ring 1–3, L-rotator orientation, normal blockers, Gremlin event blockers, and sabotage changes must remain understandable from the player’s puzzle position.':'Build a readable Workshop around the approved routing topology. Generator, live power, Ring 1–3, L-rotator orientation, normal blockers, Gremlin event blockers, and sabotage changes must remain understandable from the player’s puzzle position.',
            '- **Technical Coordinates Stay Separate** — The supporting Objective 4 layout owns grid coordinates/layers/route geometry; the PRD owns gameplay behavior and readable states only.':'- **Authored Route Topology** — Preserve the approved route topology and blocker states; player-facing communication uses in-world route states rather than coordinate labels.',
            'Implement the authored connectivity graph, L-rotator state resolution, cumulative Ring 1/2/3 validation, 20-second route-swap sabotage, 50%/80% rollback events, platform-side scoring evidence, interruption handling, and full reset. The technical layout document supplies exact topology/coordinates; it does not change these gameplay rules.':'Implement the approved authored routing graph, L-rotator state resolution, cumulative Ring 1/2/3 validation, 20-second route-swap sabotage, 50%/80% rollback events, platform-side scoring evidence, interruption handling, and full reset.',
            '- **No Legacy Special Tools** — This revision uses checkpoint barrels, blocks, ladders, route choice, and the Level 3 time challenge; do not require the prior Spring Column or Anchor Ring mechanics.':'- **Blocks and Ladders Only** — Gallery construction uses checkpoint barrel blocks/ladders and authored placement markers.'
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected canonical wording: {old[:80]}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Create new render-data file
        run: |
          PROJECT=workspace/active/the-clockwork-vault
          python .tmp-clockwork/make_render_next.py "$PROJECT/work/content.md" "$PROJECT/work/render-data.next.json"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('workspace/active/the-clockwork-vault')
          rp=p/'work/render-data.next.json'
          d=json.loads(rp.read_text(encoding='utf-8'))
          d['overview'].update({
              'main_experience':'A solo restoration journey where the player learns invented vault mechanics, adapts to controlled setbacks, and restores the Great Orrery across four scored objectives.',
              'document_scope':'Defines the complete player journey plus the level-design, runtime, scoring evidence, persistence, reset, and handoff requirements needed to build The Clockwork Vault.',
              'intended_use':'Production reference for Level Design, Development, QA, and project review.'
          })
          rp.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          expected=hashlib.sha256((p/'work/content.md').read_bytes()).hexdigest()
          assert d['canonical_content_sha256']==expected
          assert len(d['gameplay_flow'])==7
          assert len(d['global_development'])==4
          assert len(d['packages'])==6
          for pkg in d['packages']:
              assert len(pkg['gameplay']['player_flow'])==5, pkg['id']
              assert len(pkg['level_design']['flow'])==4, pkg['id']
              assert len(pkg['level_design']['notes'])==4, pkg['id']
              assert len(pkg['developer']['flow'])==4, pkg['id']
              assert len(pkg['developer']['notes'])==4, pkg['id']
              has_score=isinstance(pkg['developer'].get('scoring'),dict)
              has_completion=isinstance(pkg['developer'].get('completion_data'),dict)
              assert has_score ^ has_completion, pkg['id']
              if has_score:
                  assert sum(float(x['weight'].rstrip('%')) for x in pkg['developer']['scoring']['components'])==100
          print('render-data.next.json sanity PASS')
          PY

      - name: Render-check new file before touching old file
        run: |
          PROJECT=workspace/active/the-clockwork-vault
          mkdir -p /tmp/clockwork-voice
          for f in voice-production.md voice-requirements.md; do
            [ ! -f "$PROJECT/work/$f" ] || mv "$PROJECT/work/$f" "/tmp/clockwork-voice/$f"
          done
          python kits/project-document-generator/renderer/render.py "$PROJECT/work/render-data.next.json" /tmp/clockwork-next.html
          for f in /tmp/clockwork-voice/*; do [ ! -e "$f" ] || mv "$f" "$PROJECT/work/"; done
          test -s /tmp/clockwork-next.html

      - name: Promote new file and prepare handoff
        run: |
          PROJECT=workspace/active/the-clockwork-vault
          mv "$PROJECT/work/render-data.json" "$PROJECT/work/render-data.previous.json"
          mv "$PROJECT/work/render-data.next.json" "$PROJECT/work/render-data.json"
          cat > "$PROJECT/work/acceptance.md" <<'EOF'
          # PRD Acceptance
          Status: handoff_ready
          Mechanical: PASS
          Semantic Readiness: PASS
          Material Conservation: PASS
          Visual sanity: NOT PROVEN
          Critical: 0
          Major: 0
          EOF
          cat > "$PROJECT/state/handoff-state.yaml" <<'EOF'
          project: the-clockwork-vault
          status: handoff_ready
          accepted_prd_version: 1.0.0
          baseline_handoff: revised_and_revalidated
          content: work/content.md
          content_status: current
          render_data: work/render-data.json
          render_data_status: current
          html: output/v1.0.0/prd.html
          html_status: current
          context: output/v1.0.0/context.md
          context_status: current
          index: output/v1.0.0/index.json
          index_status: current
          acceptance: work/acceptance.md
          handoff: output/README.md
          revision_review: work/review.md
          revision_review_status: approved
          asset_requirements: work/asset-requirements.md
          asset_requirements_status: current
          next_step: revise_voice_from_current_prd_handoff
          EOF

      - name: Regenerate delivery without stale Voice
        run: |
          PROJECT=workspace/active/the-clockwork-vault
          mkdir -p /tmp/clockwork-voice-final
          for f in voice-production.md voice-requirements.md; do
            [ ! -f "$PROJECT/work/$f" ] || mv "$PROJECT/work/$f" "/tmp/clockwork-voice-final/$f"
          done
          python kits/project-document-generator/renderer/delivery.py "$PROJECT"
          for f in /tmp/clockwork-voice-final/*; do [ ! -e "$f" ] || mv "$f" "$PROJECT/work/"; done

      - name: Full mechanical and handoff validation
        run: |
          PROJECT=workspace/active/the-clockwork-vault
          python kits/project-document-generator/validator/validate.py "$PROJECT"
          python kits/project-document-generator/validator/validate_handoff.py "$PROJECT"

      - name: Advance Voice state
        run: |
          PROJECT=workspace/active/the-clockwork-vault
          cat > "$PROJECT/state/voice-state.yaml" <<'EOF'
          flow: 5
          status: ready_for_revision
          source_handoff: state/handoff-state.yaml
          source_prd_revision: 1.0.0
          requirements: work/voice-requirements.md
          requirements_status: stale_for_current_gameplay_revision
          script: work/voice-production.md
          script_status: stale_for_current_gameplay_revision
          project_html: output/v1.0.0/prd.html
          project_html_status: current_prd_without_revised_voice
          acceptance: work/voice-acceptance.md
          unresolved_upstream: 0
          mechanical: pending_voice_revision
          coverage: pending_voice_revision
          terminology_pronunciation: pending_voice_revision
          speaker_channel_trigger: pending_voice_revision
          performance_continuity: pending_voice_revision
          project_html_visual: pending_voice_revision
          audio_evidence: not_provided
          delivery_scope: revise_affected_voice_scope_from_current_prd
          next_step: revise_voice_requirements_and_voice_production
          EOF
          cat > docs/knowledge/next-action.md <<'EOF'
          # Next Action

          ## Current Status

          `CLOCKWORK_PRD_HANDOFF_READY`

          The approved Clockwork gameplay revision for Objectives 1-4 is projected into the current v1.0.0 delivery bundle and mechanically validated. Objective 1 uses the approved partial display, 2 rule + 8 useful clue + 2 harmless decoy book structure, and hidden Orange / Brown / Purple + Left-pulse solution.

          Existing Voice canonical files remain stale for the previous gameplay revision and were intentionally excluded from the current PRD render.

          ## Next Step

          Revise the affected Voice requirements and Voice Production from the current handoff-ready PRD, validate Voice, then rerender the same v1.0.0 project HTML with revised Voice included.
          EOF

      - name: Remove old file and temporary tooling
        run: |
          PROJECT=workspace/active/the-clockwork-vault
          rm -f "$PROJECT/work/render-data.previous.json"
          rm -rf .tmp-clockwork
          rm -f .github/workflows/clockwork-finalize-once.yml

      - name: Commit finalized Clockwork delivery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "finalize Clockwork PRD gameplay revision"
          git push origin HEAD:Local
