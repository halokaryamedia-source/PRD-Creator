name: Production Verify

on:
  push:
    branches:
      - Local
    paths:
      - "kits/**"
      - "tests/**"
      - "requirements.lock.txt"
      - "tools/verify_repository.py"
      - ".github/workflows/production-verify.yml"
  pull_request:
    branches:
      - Local
      - main
    paths:
      - "kits/**"
      - "tests/**"
      - "requirements.lock.txt"
      - "tools/verify_repository.py"
      - ".github/workflows/production-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Production contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        id: dependencies
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check

      - name: Compile Python sources
        id: compile
        continue-on-error: true
        run: python -m compileall -q kits tools tests

      - name: Project Document contracts
        id: prd
        continue-on-error: true
        run: python -m unittest tests.test_prd_contracts tests.test_prd_handoff_contracts tests.test_prd_flow2_state_contracts -v

      - name: Voice Production contracts
        id: voice
        continue-on-error: true
        run: python -m unittest tests.test_voice_contracts -v

      - name: Enforce verification result
        if: always()
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          PRD_OUTCOME: ${{ steps.prd.outcome }}
          VOICE_OUTCOME: ${{ steps.voice.outcome }}
        run: |
          failed=0
          for gate in DEPENDENCIES COMPILE PRD VOICE; do
            outcome_var="${gate}_OUTCOME"
            outcome="${!outcome_var}"
            if [ "$outcome" != "success" ]; then
              echo "${gate} gate failed: ${outcome}"
              failed=1
            fi
          done
          exit "$failed"
