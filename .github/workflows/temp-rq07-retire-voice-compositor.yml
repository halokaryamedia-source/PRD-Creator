name: Temp RQ07 Retire Voice Compositor

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/temp-rq07-retire-voice-compositor.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Retire unused Voice-only compositor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def read(rel: str) -> str:
              return (ROOT / rel).read_text(encoding="utf-8")

          def write(rel: str, text: str) -> None:
              (ROOT / rel).write_text(text, encoding="utf-8")

          def remove_before(text: str, start: str, end: str) -> str:
              start_index = text.find(start)
              end_index = text.find(end, start_index + len(start))
              if start_index < 0 or end_index < 0:
                  raise SystemExit(f"retirement boundary missing: {start!r} -> {end!r}")
              return text[:start_index] + text[end_index:]

          rel = "kits/project-document-generator/renderer/production_assets.py"
          text = read(rel)
          text = text.replace('SCRIPT_MARKER = \'id="production-assets-copy-script"\'\n', "", 1)
          text = remove_before(
              text,
              "@dataclass\nclass SectionPresentation:",
              "\n\ndef _has_initial_performance_tag",
          )
          text = remove_before(
              text,
              "def _journey_label(",
              "\n\ndef _section_setup_html",
          )
          text = remove_before(
              text,
              "def _section_shell_html(",
              "\n\ndef _performance_html",
          )
          text = remove_before(
              text,
              "def voice_pages(",
              "\n\nVOICE_STYLE =",
          )
          tail = text.find("def _insert_before_closing(")
          if tail < 0:
              raise SystemExit("old compositor tail marker missing")
          text = text[:tail].rstrip() + "\n"

          retired = (
              "class SectionPresentation:",
              "def _journey_label(",
              "def _section_metadata(",
              "def _section_shell_html(",
              "def voice_pages(",
              "def _production_assets_navigation(",
              "def augment_project_html(",
              "def _insert_before_closing(",
              "SCRIPT_MARKER",
          )
          for marker in retired:
              if marker in text:
                  raise SystemExit(f"retired Voice compositor marker remains: {marker}")
          required = (
              "def parse_voice_production(",
              "def parse_voice_requirement_triggers(",
              "def _section_speakers(",
              "def _section_setup_html(",
              "def _entry_html(",
              "VOICE_STYLE =",
              "VOICE_COPY_SCRIPT =",
          )
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"required Voice primitive was removed: {marker}")
          write(rel, text)

          # Lock the source boundary with one focused regression.
          rel = "tests/test_prd_voice_assets.py"
          text = read(rel)
          test = '''\n    def test_voice_helper_module_contains_primitives_not_retired_compositor(self) -> None:\n        source = (\n            Path(__file__).resolve().parents[1]\n            / "kits"\n            / "project-document-generator"\n            / "renderer"\n            / "production_assets.py"\n        ).read_text(encoding="utf-8")\n        for marker in (\n            "def voice_pages(",\n            "def _production_assets_navigation(",\n            "def augment_project_html(",\n            "def _section_shell_html(",\n        ):\n            self.assertNotIn(marker, source)\n        for marker in (\n            "def parse_voice_production(",\n            "def parse_voice_requirement_triggers(",\n            "def _section_setup_html(",\n            "def _entry_html(",\n            "VOICE_STYLE =",\n            "VOICE_COPY_SCRIPT =",\n        ):\n            self.assertIn(marker, source)\n\n'''
          if "test_voice_helper_module_contains_primitives_not_retired_compositor" not in text:
              final_marker = '\n\nif __name__ == "__main__":\n'
              if final_marker not in text:
                  raise SystemExit("test_prd_voice_assets final marker missing")
              text = text.replace(final_marker, test + final_marker, 1)
          write(rel, text)

          # Durable tracking.
          rel = "docs/knowledge/reviews/repository-quality-audit-2026-08-14.md"
          text = read(rel)
          old = "| RQ-07 | P1/P2 | `production_assets.py` still contains the retired Voice-only compositor/navigation in addition to Voice primitives now reused by `production_assets_objective.py`. | Dead architecture can attract future AI edits to the wrong owner/path. | OPEN |"
          new = "| RQ-07 | P1/P2 | `production_assets.py` retained the retired Voice-only compositor/navigation in addition to primitives used by `production_assets_objective.py`. | Dead architecture could attract future AI edits to the wrong owner/path. | FIXED — retired compositor removed; only consumed Voice primitives remain |"
          if old not in text:
              raise SystemExit("RQ-07 audit row missing")
          text = text.replace(old, new, 1)
          update = "## Remediation update — RQ-07 retired Voice compositor\n\nThe current objective-first compositor remains the sole Production Assets compositor. `production_assets.py` now contains only Voice parsing/presentation primitives actually consumed by that owner; the old Voice-only page/navigation/augmentation entrypoints were deleted instead of preserved as a fallback.\n\n"
          if "## Remediation update — RQ-07 retired Voice compositor" not in text:
              marker = "## Ordered remediation\n"
              if marker not in text:
                  raise SystemExit("audit Ordered remediation marker missing")
              text = text.replace(marker, update + marker, 1)
          write(rel, text)

          rel = "docs/knowledge/operations/backlog.md"
          text = read(rel)
          line = "1. **RQ-07 — retire old Voice-only compositor path (P1/P2):** keep only Voice primitives used by the objective-first compositor; remove unused legacy compositor/navigation functions after focused contract proof.\n"
          if line not in text:
              raise SystemExit("backlog RQ-07 line missing")
          text = text.replace(line, "", 1)
          text = text.replace("2. **RQ-08", "1. **RQ-08", 1)
          text = text.replace("3. **RQ-09", "2. **RQ-09", 1)
          text = text.replace("4. **RQ-10", "3. **RQ-10", 1)
          text = text.replace("5. **RQ-14", "4. **RQ-14", 1)
          text = text.replace(
              "Closed items RQ-01, RQ-02, RQ-03, RQ-04, RQ-05, RQ-06, RQ-12, RQ-13, RQ-15, and RQ-16",
              "Closed items RQ-01, RQ-02, RQ-03, RQ-04, RQ-05, RQ-06, RQ-07, RQ-12, RQ-13, RQ-15, and RQ-16",
              1,
          )
          write(rel, text)

          write("docs/knowledge/next-action.md", '''# Next Action\n\n## Current Status\n\n`REPOSITORY_QUALITY_RETIRED_VOICE_COMPOSITOR_REMOVED`\n\nThe full audit remains durable at `docs/knowledge/reviews/repository-quality-audit-2026-08-14.md`. RQ-07 is closed: the objective-first compositor is the only Production Assets compositor and the Voice helper module no longer carries an alternate legacy page/navigation path. All still-open findings remain ordered in `docs/knowledge/operations/backlog.md`.\n\n## Next Step\n\nComplete **RQ-08 — validator layering simplification** incrementally: remove monkey-patch ownership between `validator/validate.py` and `_engine.py` without rewriting the validator or changing current validation semantics.\n''')
          PY

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check

      - name: Verify current compositor only
        run: |
          python -m unittest tests.test_prd_voice_assets tests.test_voice_contracts -v
          python kits/project-document-generator/renderer/delivery.py workspace/active/the-clockwork-vault
          python kits/project-document-generator/validator/validate.py workspace/active/the-clockwork-vault
          python kits/voice-production-kit/validator/validate.py workspace/active/the-clockwork-vault
          python tools/verify_repository.py

      - name: Commit and self-delete workflow
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git rm .github/workflows/temp-rq07-retire-voice-compositor.yml
          git add -A
          git commit -m "refactor: retire old Voice-only compositor"
          git push origin HEAD:Local
