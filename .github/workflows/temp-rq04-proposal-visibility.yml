name: Temp RQ04 Proposal Visibility

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/temp-rq04-proposal-visibility.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply RQ04 semantic contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def read(rel: str) -> str:
              return (ROOT / rel).read_text(encoding="utf-8")

          def write(rel: str, text: str) -> None:
              (ROOT / rel).write_text(text, encoding="utf-8")

          def replace_required(rel: str, old: str, new: str) -> None:
              text = read(rel)
              if old not in text:
                  raise SystemExit(f"{rel}: expected text not found: {old[:100]!r}")
              write(rel, text.replace(old, new, 1))

          # Durable Flow 2 policy: solve-first remains, material AI choices become visible once.
          rel = "docs/foundation/02-source-intake-recovery.md"
          replace_required(
              rel,
              "  Saran AI       # only when useful",
              "  Saran AI       # required when material AI-chosen Proposals exist",
          )
          marker = "Keep internal SRC/REQ/YAML/provenance/Golden DOM jargon out of the user's way. `Perlu Konfirmasi` is reserved for the rare genuinely user/external-only blocker."
          addition = marker + "\n\nEvery **material AI-chosen Proposal** must appear once in the preview's `Saran AI` block before approval. Material means a chosen default that changes gameplay behavior or scope, including timing, quantity, progression, scoring, fail/recovery, reward, build scope, or runtime behavior. State the chosen default concisely; do not turn this into a question-by-question approval flow. Omit `Saran AI` only when the reviewed slice contains no material AI-chosen Proposal."
          replace_required(rel, marker, addition)

          # Detailed Flow 2 procedure.
          rel = "kits/project-document-generator/SOURCE-INTAKE.md"
          replace_required(
              rel,
              "Saran AI                 # optional\n- only material choices worth calling out",
              "Saran AI                 # required when material AI-chosen Proposals exist\n- each material AI-chosen default once; omit only when none exist",
          )
          marker = "Do not expose `SRC-###`, `REQ-###`, YAML, provenance jargon, Golden DOM terms, or validator detail by default. **do not turn the preview into a second PRD**; it should remain a compact checkpoint over the complete underlying model."
          addition = marker + "\n\nDo not label every recovered sentence as source-derived versus AI-added. However, every **material AI-chosen Proposal** must be disclosed once in `Saran AI` before approval. This includes chosen timing, quantity, progression, scoring, fail/recovery, reward, build-scope, or runtime-behavior defaults. Source-backed recovery and non-material production choices do not need individual labels. Keep one compact disclosure list rather than a multi-question decision dialog."
          replace_required(rel, marker, addition)
          marker = "Natural-language user approval is sufficient. If the user corrects the preview, persist the correction as higher authority, update only affected proposal/requirements, rerun only invalidated reasoning, and re-preview only the affected slice when needed."
          addition = "Natural-language user approval is sufficient. A material Proposal counts as represented by the preview only when its chosen default appears once in `Saran AI`; do not promote a hidden material AI choice through blanket approval. If the user corrects the preview, persist the correction as higher authority, update only affected proposal/requirements, rerun only invalidated reasoning, and re-preview only the affected slice when needed."
          replace_required(rel, marker, addition)

          # Production kit skill.
          rel = "kits/project-document-generator/SKILL.md"
          replace_required(
              rel,
              "Saran AI                     # optional\n- only material choices the AI filled and that are useful to call out",
              "Saran AI                     # required when material AI-chosen Proposals exist\n- each material AI-chosen default once; omit only when none exist",
          )
          replace_required(
              rel,
              "Do not label every recovered sentence as source-derived versus AI-added. Surface `Saran AI` only when a material proposal is uncertain/conflict-resolving enough that the user benefits from seeing it. A normal preview can simply present the proposed complete model.",
              "Do not label every recovered sentence as source-derived versus AI-added. Every **material AI-chosen Proposal** must be disclosed once in `Saran AI` before approval; this includes chosen timing, quantity, progression, scoring, fail/recovery, reward, build scope, and runtime behavior. Keep it one compact disclosure list, not a multi-option questionnaire. Omit the block only when the reviewed slice contains no material AI-chosen Proposal.",
          )

          # Root semantic specialist.
          rel = ".agents/skills/project-document-production/SKILL.md"
          replace_required(
              rel,
              "The Simple Chat Preview stays objective-based and simple. It summarizes the complete underlying model; it does not need to expose every Golden slot or internal proposal record. Surface `Saran AI` only for material choices whose uncertainty/conflict is useful to the user.",
              "The Simple Chat Preview stays objective-based and simple. It summarizes the complete underlying model; it does not need to expose every Golden slot or internal proposal record. Every material AI-chosen Proposal must appear once in `Saran AI` before approval, while source-backed recovery and non-material production choices stay unlabeled. Keep the disclosure compact instead of turning it into a question-by-question approval flow.",
          )
          replace_required(
              rel,
              "Approval of the complete preview approves the represented pending proposals unless the user explicitly corrects/rejects them. Persist those approvals before entering Flow 3.",
              "Approval of the complete preview approves the represented pending proposals unless the user explicitly corrects/rejects them. A material Proposal is represented only when its chosen default is visible once in `Saran AI`; hidden material AI choices cannot be promoted by blanket approval. Persist those approvals before entering Flow 3.",
          )

          # Kit-wide invariant.
          rel = "kits/project-document-generator/RULES.md"
          marker = "- After preview approval, promote represented pending proposals into approved requirement/project state before Flow 3."
          addition = marker + "\n- A material AI-chosen Proposal is represented only when its chosen default appears once in the Simple Chat Preview `Saran AI` block. Do not hide timing, quantity, scoring, fail/recovery, progression, reward, build-scope, or runtime-behavior choices inside otherwise natural preview prose."
          replace_required(rel, marker, addition)

          # Focused contract proof.
          rel = "tests/test_prd_flow2_state_contracts.py"
          text = read(rel)
          if 'FOUNDATION_FLOW2 = ROOT / "docs" / "foundation" / "02-source-intake-recovery.md"' not in text:
              text = text.replace(
                  'SOURCE_INTAKE = ROOT / "kits" / "project-document-generator" / "SOURCE-INTAKE.md"\n',
                  'SOURCE_INTAKE = ROOT / "kits" / "project-document-generator" / "SOURCE-INTAKE.md"\nFOUNDATION_FLOW2 = ROOT / "docs" / "foundation" / "02-source-intake-recovery.md"\n',
                  1,
              )
          old = '        source_intake = SOURCE_INTAKE.read_text(encoding="utf-8")\n        skill = KIT_SKILL.read_text(encoding="utf-8")\n'
          new = '        source_intake = SOURCE_INTAKE.read_text(encoding="utf-8")\n        foundation = FOUNDATION_FLOW2.read_text(encoding="utf-8")\n        skill = KIT_SKILL.read_text(encoding="utf-8")\n'
          if old not in text:
              raise SystemExit("Flow2 contract test read marker missing")
          text = text.replace(old, new, 1)
          marker = '        self.assertIn("The Simple Chat Preview is not a new artifact", skill)\n'
          if marker not in text:
              raise SystemExit("Flow2 contract test assertion marker missing")
          addition = marker + '        self.assertIn("material AI-chosen Proposal", source_intake)\n        self.assertIn("required when material AI-chosen Proposals exist", source_intake)\n        self.assertIn("material AI-chosen Proposal", foundation)\n        self.assertIn("material AI-chosen Proposals exist", skill)\n'
          text = text.replace(marker, addition, 1)
          write(rel, text)

          # Durable audit/backlog/continuation.
          rel = "docs/knowledge/reviews/repository-quality-audit-2026-08-14.md"
          replace_required(
              rel,
              "| RQ-04 | P1 | Flow 2 can choose material Proposal defaults (timing, quantities, scoring, recovery, runtime behavior, etc.) while `Saran AI` is optional in the preview. | A polished AI guess can become approved project truth without the user noticing which material facts were AI-chosen. | OPEN |",
              "| RQ-04 | P1 | Flow 2 could choose material Proposal defaults while `Saran AI` remained optional. | A polished AI guess could become approved project truth without the user noticing which material facts were AI-chosen. | FIXED — every material AI-chosen Proposal is disclosed once before approval |",
          )
          text = read(rel)
          if "## Remediation update — RQ-04 material Proposal visibility" not in text:
              marker = "## Ordered remediation\n"
              update = "## Remediation update — RQ-04 material Proposal visibility\n\nThe solve-first Flow 2 model is preserved. The change is only the approval boundary: when AI chooses a material default that changes gameplay or production scope, that chosen value must appear once in the compact `Saran AI` disclosure before blanket preview approval can promote it. This adds no artifact, stage, or option-by-option questionnaire.\n\n"
              if marker not in text:
                  raise SystemExit("audit Ordered remediation marker missing")
              text = text.replace(marker, update + marker, 1)
              write(rel, text)

          rel = "docs/knowledge/operations/backlog.md"
          text = read(rel)
          rq04 = "1. **RQ-04 — material AI Proposal visibility (P1):** every AI-chosen material default that changes timing, quantity, scoring, fail/recovery, progression, reward, build scope, or runtime behavior must appear once in the Simple Chat Preview `Saran AI` summary before approval. Keep one complete preview, not a questionnaire.\n"
          if rq04 not in text:
              raise SystemExit("backlog RQ-04 line missing")
          text = text.replace(rq04, "", 1)
          remaining = [line for line in text.splitlines() if line and re.match(r"^\d+\. \*\*RQ-", line)] if False else None
          # Explicit renumbering after removing item 1.
          text = text.replace("2. **RQ-06", "1. **RQ-06", 1)
          text = text.replace("3. **RQ-05", "2. **RQ-05", 1)
          text = text.replace("4. **RQ-07", "3. **RQ-07", 1)
          text = text.replace("5. **RQ-08", "4. **RQ-08", 1)
          text = text.replace("6. **RQ-09", "5. **RQ-09", 1)
          text = text.replace("7. **RQ-10", "6. **RQ-10", 1)
          text = text.replace("8. **RQ-14", "7. **RQ-14", 1)
          text = text.replace(
              "Closed items RQ-01, RQ-02, RQ-03, RQ-12, RQ-15, and RQ-16",
              "Closed items RQ-01, RQ-02, RQ-03, RQ-04, RQ-12, RQ-15, and RQ-16",
              1,
          )
          write(rel, text)

          write("docs/knowledge/next-action.md", '''# Next Action\n\n## Current Status\n\n`REPOSITORY_QUALITY_MATERIAL_PROPOSALS_VISIBLE`\n\nThe full audit remains durable at `docs/knowledge/reviews/repository-quality-audit-2026-08-14.md`. RQ-04 is closed without changing Flow 2 into a questionnaire: solve-first proposals remain allowed, but every material AI-chosen default must be disclosed once before preview approval. All still-open findings remain ordered in `docs/knowledge/operations/backlog.md`.\n\n## Next Step\n\nComplete **RQ-06 — non-Voice Production Assets freshness**: prove that current `work/asset-requirements.md` is represented by the consolidated versioned `prd.html` using one bounded parity mechanism, without adding a checksum registry or asset framework.\n''')
          PY

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check

      - name: Verify RQ04 contract
        run: |
          python -m unittest tests.test_prd_flow2_state_contracts tests.test_prd_contracts -v
          python kits/project-document-generator/validator/validate.py workspace/active/the-clockwork-vault
          python tools/verify_repository.py

      - name: Commit and self-delete workflow
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git rm .github/workflows/temp-rq04-proposal-visibility.yml
          git add -A
          git commit -m "docs: expose material AI proposals before approval"
          git push origin HEAD:Local
