name: Normalize repository naming once

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/repository-naming-once.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply audited repository normalization
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/repository-naming-once.yml > /tmp/full-audit.yml
          python - <<'PY'
          from pathlib import Path

          text = Path('/tmp/full-audit.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Normalize repository structure\n        shell: bash\n        run: |\n'
          end_marker = '\n      - name: Install locked dependencies\n'
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          lines = []
          for line in block.splitlines():
              if line.strip().startswith('git mv .github/workflows/'):
                  continue
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          anchor = 'git rm kits/voice-production-kit/INSTRUCTIONS.md\n'
          cleanup = anchor + 'rmdir docs/knowledge/flows docs/knowledge/maintenance docs/knowledge/modules docs/knowledge/sources 2>/dev/null || true\n'
          if anchor not in script:
              raise SystemExit('expected normalization anchor not found')
          script = script.replace(anchor, cleanup, 1)
          Path('/tmp/normalize.sh').write_text(script, encoding='utf-8')
          PY

          mkdir -p docs/knowledge/workflows
          git mv docs/knowledge/maintenance/maintenance-template.md docs/knowledge/workflows/maintenance-note-template.md
          bash /tmp/normalize.sh

          python - <<'PY'
          from pathlib import Path

          template = Path('docs/knowledge/workflows/maintenance-note-template.md')
          text = template.read_text(encoding='utf-8').replace('# Maintenance Template', '# Maintenance Note Template', 1)
          template.write_text(text, encoding='utf-8')

          knowledge = Path('docs/knowledge/README.md')
          text = knowledge.read_text(encoding='utf-8')
          text = text.replace('│   └── maintenance.md\n', '│   ├── maintenance.md\n│   └── maintenance-note-template.md\n')
          knowledge.write_text(text, encoding='utf-8')

          verify = Path('tools/verify_repository.py')
          text = verify.read_text(encoding='utf-8')
          needle = '    "docs/knowledge/workflows/maintenance.md",\n'
          insert = needle + '    "docs/knowledge/workflows/maintenance-note-template.md",\n'
          if needle not in text:
              raise SystemExit('repository verifier workflow-path anchor missing')
          verify.write_text(text.replace(needle, insert, 1), encoding='utf-8')
          PY

          git diff --check

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check

      - name: Verify repository and production contracts
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_repository.py
          python -m compileall -q kits tools tests
          python -m unittest \
            tests.test_prd_contracts \
            tests.test_prd_handoff_contracts \
            tests.test_prd_flow2_state_contracts \
            tests.test_prd_hierarchy_contracts \
            tests.test_prd_golden_reference -v
          python -m unittest tests.test_voice_contracts -v

          python kits/project-document-generator/renderer/render.py \
            workspace/active/the-clockwork-vault/work/render-data.json \
            /tmp/clockwork-final.html
          cmp /tmp/clockwork-final.html workspace/active/the-clockwork-vault/output/final.html
          test "$(sha256sum /tmp/clockwork-final.html | awk '{print $1}')" = \
            "0502e3cb78e5c834e540d9715d78cb3fbdf1f8519ab5b6a8c976c257a59d7024"

          test "$(git hash-object kits/project-document-generator/template/golden-reference.html)" = \
            "e1dccd77d7a5335213caea7a09d74ba78b2ae8e1"
          test "$(git hash-object kits/project-document-generator/template/runtime-template.html)" = \
            "e1dccd77d7a5335213caea7a09d74ba78b2ae8e1"

          if git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$'; then
            echo "Tracked Python bytecode residue found" >&2
            exit 1
          fi
          git diff --check

      - name: Commit normalized structure
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repository-naming-once.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git add -A
          git commit -m "refactor: normalize repository navigation"
          git push origin HEAD:Local
