name: Voice Verify

on:
  push:
    branches:
      - Local
    paths:
      - "kits/prd-creator/voice/**/*.py"
      - "kits/prd-creator/validator/validate_voice.py"
      - "tests/test_voice_contracts.py"
      - "requirements.lock.txt"
      - ".github/workflows/voice-verify.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Voice contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check

      - name: Compile Voice sources
        run: |
          python -m compileall -q \
            kits/prd-creator/validator/validate_voice.py \
            tests/test_voice_contracts.py

      - name: Voice Production contracts
        run: python -m unittest tests.test_voice_contracts -v
