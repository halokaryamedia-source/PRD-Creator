name: Temp Visual Proof Run

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/temp-visual-proof-run.yml"

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run browser proof
        run: python tools/temp_visual_proof.py
      - name: Run current validators
        run: |
          python kits/project-document-generator/validator/validate.py workspace/active/the-clockwork-vault
          python kits/project-document-generator/validator/validate_handoff.py workspace/active/the-clockwork-vault
          python tools/verify_repository.py
      - name: Commit proof and remove temporary helpers
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git rm .github/workflows/temp-visual-proof-run.yml tools/temp_visual_proof.py
          git add -A
          git commit -m "docs: record Production Assets browser proof"
          git push origin HEAD:Local
