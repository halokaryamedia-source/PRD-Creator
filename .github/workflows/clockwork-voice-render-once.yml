name: Clockwork Voice Render Once

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/clockwork-voice-render-once.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check

      - name: Validate accepted PRD handoff
        run: |
          python kits/project-document-generator/validator/validate_handoff.py \
            workspace/active/the-clockwork-vault

      - name: Render consolidated project HTML
        run: |
          python kits/project-document-generator/renderer/render.py \
            workspace/active/the-clockwork-vault/work/render-data.json \
            workspace/active/the-clockwork-vault/output/final.html

      - name: Validate Voice package and consolidated HTML
        run: |
          python kits/voice-production-kit/validator/validate.py \
            workspace/active/the-clockwork-vault

      - name: Commit rendered HTML and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workspace/active/the-clockwork-vault/output/final.html
          git rm .github/workflows/clockwork-voice-render-once.yml
          git commit -m "prod: render Clockwork Production Assets voice"
          git push origin HEAD:Local
