name: Temp RQ06 Asset Freshness

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/temp-rq06-asset-freshness.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply bounded asset freshness binding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def read(rel: str) -> str:
              return (ROOT / rel).read_text(encoding="utf-8")

          def write(rel: str, text: str) -> None:
              (ROOT / rel).write_text(text, encoding="utf-8")

          def replace_required(rel: str, old: str, new: str) -> None:
              text = read(rel)
              if old not in text:
                  raise SystemExit(f"{rel}: expected text not found: {old[:120]!r}")
              write(rel, text.replace(old, new, 1))

          # Current compositor owns the one non-Voice source binding.
          rel = "kits/project-document-generator/renderer/production_assets_objective.py"
          text = read(rel)
          if "import hashlib\n" not in text:
              text = text.replace("import json\n", "import hashlib\nimport json\n", 1)
          old = '    source = _insert(source, "</head>", voice.VOICE_STYLE + OBJECTIVE_STYLE, "head")\n'
          new = '''    head_additions = voice.VOICE_STYLE + OBJECTIVE_STYLE\n    if has_assets:\n        asset_sha = hashlib.sha256(asset_path.read_bytes()).hexdigest()\n        head_additions += (\n            f'\\n<meta content="{asset_sha}" name="asset-requirements-sha256"/>'\n        )\n    source = _insert(source, "</head>", head_additions, "head")\n'''
          if old not in text:
              raise SystemExit("production_assets_objective head insertion marker missing")
          text = text.replace(old, new, 1)
          write(rel, text)

          # Flow 4 parser/validator compares that one binding to the current canonical requirement file.
          rel = "kits/project-document-generator/validator/_engine.py"
          text = read(rel)
          old = "        self.render_data_sha256: list[str] = []\n"
          new = old + "        self.asset_requirements_sha256: list[str] = []\n"
          if old not in text:
              raise SystemExit("HtmlFacts render_data_sha256 marker missing")
          text = text.replace(old, new, 1)
          old = '''        if tag_name == "meta" and str(data.get("name") or "").casefold() == "render-data-sha256":\n            self.render_data_sha256.append(str(data.get("content") or ""))\n'''
          new = old + '''        if tag_name == "meta" and str(data.get("name") or "").casefold() == "asset-requirements-sha256":\n            self.asset_requirements_sha256.append(str(data.get("content") or ""))\n'''
          if old not in text:
              raise SystemExit("HtmlFacts render-data meta handler marker missing")
          text = text.replace(old, new, 1)

          marker = '    check("html_matches_current_render_data", binding_ok, html_binding_detail)\n\n'
          if marker not in text:
              raise SystemExit("validator render-data binding check marker missing")
          addition = marker + '''    asset_path = project / "work" / "asset-requirements.md"\n    asset_bindings = facts.asset_requirements_sha256\n    if asset_path.is_file():\n        actual_asset_sha = hashlib.sha256(asset_path.read_bytes()).hexdigest()\n        asset_binding_ok = (\n            len(asset_bindings) == 1\n            and SHA256_RE.fullmatch(asset_bindings[0]) is not None\n            and asset_bindings[0] == actual_asset_sha\n        )\n        if not asset_bindings:\n            asset_binding_detail = "rendered HTML is missing asset-requirements-sha256 binding"\n        elif len(asset_bindings) != 1:\n            asset_binding_detail = (\n                "rendered HTML must contain exactly one asset-requirements-sha256 binding; "\n                f"found {len(asset_bindings)}"\n            )\n        elif SHA256_RE.fullmatch(asset_bindings[0]) is None:\n            asset_binding_detail = "rendered HTML asset-requirements-sha256 binding is invalid"\n        elif asset_bindings[0] != actual_asset_sha:\n            asset_binding_detail = (\n                "rendered HTML is stale relative to work/asset-requirements.md; "\n                "rerender the current versioned prd.html"\n            )\n        else:\n            asset_binding_detail = "rendered HTML is bound to the current non-Voice Production Asset requirements"\n    else:\n        asset_binding_ok = not asset_bindings\n        asset_binding_detail = (\n            "no non-Voice Production Asset requirement source or stale binding is present"\n            if asset_binding_ok\n            else "rendered HTML still carries an asset-requirements binding but work/asset-requirements.md is absent; rerender"\n        )\n    check(\n        "html_matches_current_asset_requirements",\n        asset_binding_ok,\n        asset_binding_detail,\n    )\n\n'''
          text = text.replace(marker, addition, 1)
          write(rel, text)

          # Focused regressions on the real delivery/validator chain.
          rel = "tests/test_prd_contracts.py"
          text = read(rel)
          test = '''\n    def test_flow4_rejects_stale_non_voice_asset_requirements(self) -> None:\n        project = self.make_project(render_data())\n        asset_path = project / "work" / "asset-requirements.md"\n        asset_path.write_text(\n            "# Production Asset Requirements\\n\\n"\n            "## Core Trial\\n\\n"\n            "### 3D Models\\n\\n"\n            "#### Trial Console\\n"\n            "Requirement: Create one readable trial console for the accepted Core Trial interaction.\\n",\n            encoding="utf-8",\n        )\n        delivered = run_cli(DELIVERY, project)\n        self.assertEqual(delivered.returncode, 0, delivered.stderr or delivered.stdout)\n        validated = self.validate(project)\n        self.assertEqual(validated.returncode, 0, validated.stderr or validated.stdout)\n\n        asset_path.write_text(\n            asset_path.read_text(encoding="utf-8").replace(\n                "one readable trial console",\n                "one revised readable trial console",\n                1,\n            ),\n            encoding="utf-8",\n        )\n        stale = self.validate(project)\n        self.assertEqual(stale.returncode, 1, stale.stderr or stale.stdout)\n        payload = json.loads(stale.stdout)\n        check = next(\n            item for item in payload["checks"]\n            if item["check"] == "html_matches_current_asset_requirements"\n        )\n        self.assertEqual(check["status"], "fail")\n        self.assertIn("stale relative to work/asset-requirements.md", check["detail"])\n\n    def test_flow4_rejects_stale_asset_binding_after_source_removal(self) -> None:\n        project = self.make_project(render_data())\n        asset_path = project / "work" / "asset-requirements.md"\n        asset_path.write_text(\n            "# Production Asset Requirements\\n\\n"\n            "## Core Trial\\n\\n"\n            "### UI & Information\\n\\n"\n            "#### Trial Prompt\\n"\n            "Requirement: Show the current Core Trial instruction.\\n",\n            encoding="utf-8",\n        )\n        delivered = run_cli(DELIVERY, project)\n        self.assertEqual(delivered.returncode, 0, delivered.stderr or delivered.stdout)\n        asset_path.unlink()\n        stale = self.validate(project)\n        self.assertEqual(stale.returncode, 1, stale.stderr or stale.stdout)\n        payload = json.loads(stale.stdout)\n        check = next(\n            item for item in payload["checks"]\n            if item["check"] == "html_matches_current_asset_requirements"\n        )\n        self.assertEqual(check["status"], "fail")\n        self.assertIn("binding", check["detail"])\n\n'''
          if "test_flow4_rejects_stale_non_voice_asset_requirements" not in text:
              final_marker = '\n\nif __name__ == "__main__":\n'
              if final_marker not in text:
                  raise SystemExit("test_prd_contracts final marker missing")
              text = text.replace(final_marker, test + final_marker, 1)
          write(rel, text)

          # Current contracts explain the narrow freshness binding, not a registry.
          rel = "kits/project-document-generator/RENDERING.md"
          text = read(rel)
          marker = "- `output/README.md` is the stable resume entry point that identifies the current version and reading route.\n"
          addition = marker + "- when `work/asset-requirements.md` exists, the consolidated `prd.html` carries one `asset-requirements-sha256` source binding so Flow 4 can reject a stale non-Voice Production Assets view; this is a single freshness binding, not an asset manifest/checksum registry.\n"
          if marker not in text:
              raise SystemExit("RENDERING delivery responsibilities marker missing")
          text = text.replace(marker, addition, 1)
          write(rel, text)

          rel = "kits/project-document-generator/VALIDATION.md"
          text = read(rel)
          marker = "Mechanical validation owns deterministic facts: Flow 2 readiness, required current artifacts, canonical/projection/render bindings, page order/IDs/navigation, scoring arithmetic, required Golden markers, and the narrow observed content-purity regression set.\n"
          replacement = "Mechanical validation owns deterministic facts: Flow 2 readiness, required current artifacts, canonical/projection/render bindings, non-Voice Production Asset source freshness when that source exists, page order/IDs/navigation, scoring arithmetic, required Golden markers, and the narrow observed content-purity regression set.\n"
          if marker not in text:
              raise SystemExit("VALIDATION mechanical scope marker missing")
          text = text.replace(marker, replacement, 1)
          write(rel, text)

          # Durable tracking.
          rel = "docs/knowledge/reviews/repository-quality-audit-2026-08-14.md"
          text = read(rel)
          old = "| RQ-06 | P1 | Base PRD HTML is bound to `render-data.json`, but non-Voice `asset-requirements.md` freshness is not equivalently proven at handoff. | Asset requirements can change while a stale consolidated `prd.html` still appears coherent. | OPEN |"
          new = "| RQ-06 | P1 | Base PRD HTML was bound to `render-data.json`, but non-Voice `asset-requirements.md` freshness was not equivalently proven. | Asset requirements could change while a stale consolidated `prd.html` still appeared coherent. | FIXED — one current-source hash binding validated by Flow 4 |"
          if old not in text:
              raise SystemExit("RQ-06 audit row missing")
          text = text.replace(old, new, 1)
          update = "## Remediation update — RQ-06 non-Voice asset freshness\n\nThe objective-first compositor now embeds one exact binding for `work/asset-requirements.md` only when that source exists. Flow 4 compares it to the current source and also rejects a stale binding after source removal. This is intentionally one freshness proof, not a checksum registry, manifest, or asset framework.\n\n"
          if "## Remediation update — RQ-06 non-Voice asset freshness" not in text:
              marker = "## Ordered remediation\n"
              if marker not in text:
                  raise SystemExit("audit Ordered remediation marker missing")
              text = text.replace(marker, update + marker, 1)
          write(rel, text)

          rel = "docs/knowledge/operations/backlog.md"
          text = read(rel)
          line = "1. **RQ-06 — non-Voice Production Assets freshness (P1):** prove current `asset-requirements.md` is represented by the consolidated versioned `prd.html` using one bounded parity mechanism; do not add a checksum registry/framework.\n"
          if line not in text:
              raise SystemExit("backlog RQ-06 line missing")
          text = text.replace(line, "", 1)
          text = text.replace("2. **RQ-05", "1. **RQ-05", 1)
          text = text.replace("3. **RQ-07", "2. **RQ-07", 1)
          text = text.replace("4. **RQ-08", "3. **RQ-08", 1)
          text = text.replace("5. **RQ-09", "4. **RQ-09", 1)
          text = text.replace("6. **RQ-10", "5. **RQ-10", 1)
          text = text.replace("7. **RQ-14", "6. **RQ-14", 1)
          text = text.replace(
              "Closed items RQ-01, RQ-02, RQ-03, RQ-04, RQ-12, RQ-15, and RQ-16",
              "Closed items RQ-01, RQ-02, RQ-03, RQ-04, RQ-06, RQ-12, RQ-15, and RQ-16",
              1,
          )
          write(rel, text)

          write("docs/knowledge/next-action.md", '''# Next Action\n\n## Current Status\n\n`REPOSITORY_QUALITY_ASSET_FRESHNESS_GUARDED`\n\nThe full audit remains durable at `docs/knowledge/reviews/repository-quality-audit-2026-08-14.md`. RQ-06 is closed with one bounded non-Voice source-freshness binding; no asset manifest, checksum registry, or new framework was added. All still-open findings remain ordered in `docs/knowledge/operations/backlog.md`.\n\n## Next Step\n\nComplete **RQ-05 + RQ-13 — Production Assets identity**: remove ambiguous visible `04A`/`04B` overlap and make Production Assets DOM IDs stable by semantic section identity while preserving accepted PRD Development page identities.\n''')
          PY

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check

      - name: Verify asset freshness contract
        run: |
          python -m unittest tests.test_prd_contracts tests.test_prd_voice_assets -v
          python kits/project-document-generator/validator/validate.py workspace/active/the-clockwork-vault
          python kits/project-document-generator/validator/validate_handoff.py workspace/active/the-clockwork-vault
          python tools/verify_repository.py

      - name: Commit and self-delete workflow
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git rm .github/workflows/temp-rq06-asset-freshness.yml
          git add -A
          git commit -m "fix: guard non-Voice asset freshness"
          git push origin HEAD:Local
