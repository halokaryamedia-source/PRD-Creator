name: Clockwork Production Assets Readability Once

on:
  push:
    branches: [Local]
    paths:
      - ".tmp-pa-readability/READY"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check
      - name: Apply readability refinement
        run: python .tmp-pa-readability/patch.py
      - name: Compile and contract-test
        run: |
          python -m compileall -q kits/project-document-generator/renderer kits/voice-production-kit
          python -m unittest tests.test_voice_contracts -v
      - name: Rerender Clockwork
        run: python kits/project-document-generator/renderer/delivery.py workspace/active/the-clockwork-vault/
      - name: Validate PRD and Voice
        run: |
          python kits/project-document-generator/validator/validate.py workspace/active/the-clockwork-vault/
          python kits/project-document-generator/validator/validate_handoff.py workspace/active/the-clockwork-vault/
          python kits/voice-production-kit/validator/validate.py workspace/active/the-clockwork-vault/
      - name: Verify developer readability contract
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('workspace/active/the-clockwork-vault/output/v1.0.0/prd.html').read_text(encoding='utf-8')
          required=['class="pa-flow-nav"','What to Build','When / Where','Player Text','Copy Text','Copy Prompt','The Cheeky Trickster']
          for token in required:
              assert token in html, token
          forbidden=['Copy Flow Text','pa-flow-copy-source','<h3>UI &amp; Information</h3>','<h3>Audio</h3>','<h3>Visual Effects &amp; Presentation</h3>']
          for token in forbidden:
              assert token not in html, token
          print('Production Assets readability UX PASS')
          PY
      - name: Update next action
        run: |
          cat > docs/knowledge/next-action.md <<'EOF'
          # Next Action

          ## Current Status

          `CLOCKWORK_PRODUCTION_ASSETS_READABLE`

          The Clockwork v1.0.0 PRD remains handoff-ready and Voice remains delivery-ready. Production Assets is gameplay-flow-first with quick-jump navigation. Copy Flow Text aggregation has been removed. Each Asset Requirement now presents a compact developer work card: secondary asset-type badge, What to Build, When/Where when available, and exact per-item player text or Voice prompt with its own Copy action.

          PRD, handoff, Voice validation, renderer contract tests, and the Production Assets readability structural check pass. Browser-level visual quality still requires direct visual review.

          ## Next Step

          Review the regenerated Production Assets pages in-browser. If the work-card hierarchy is accepted, continue with implementation/audio production rather than adding more document structure.
          EOF
      - name: Cleanup one-shot tooling
        run: |
          rm -rf .tmp-pa-readability
          rm -f .github/workflows/clockwork-pa-readability-once.yml
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refine Production Assets developer readability"
          git push origin HEAD:Local
