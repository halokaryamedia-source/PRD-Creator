name: Temp Repository Quality P0 Cleanup

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/temp-repository-quality-cleanup-v2.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply P0 validator and migration fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          ROOT = Path.cwd()

          def read(rel: str) -> str:
              return (ROOT / rel).read_text(encoding="utf-8")

          def write(rel: str, text: str) -> None:
              (ROOT / rel).write_text(text, encoding="utf-8")

          # RQ-01: resolve the current versioned human PRD from document.version.
          rel = "kits/project-document-generator/validator/_engine.py"
          text = read(rel)
          old = '    html_path = project / "output" / "final.html"\n'
          if text.count(old) != 1:
              raise SystemExit("validator legacy html_path binding not found exactly once")
          text = text.replace(old, '    html_path: Path | None = None\n', 1)
          old = '    check("rendered_html_exists", html_path.is_file(), str(html_path))\n'
          if text.count(old) != 1:
              raise SystemExit("validator early rendered_html_exists check not found exactly once")
          text = text.replace(old, "", 1)

          marker = (
              '    if not isinstance(data, dict):\n'
              '        errors.append("render_data_root: render-data must be an object")\n'
              '        return {"status": "fail", "errors": errors, "warnings": warnings, "checks": checks}\n\n'
          )
          if text.count(marker) != 1:
              raise SystemExit("validator render-data root marker not found exactly once")
          insert = marker + (
              '    document_meta = data.get("document")\n'
              '    current_version = (\n'
              '        text_en(document_meta.get("version")).strip()\n'
              '        if isinstance(document_meta, dict)\n'
              '        else ""\n'
              '    )\n'
              '    html_path = (\n'
              '        project / "output" / f"v{current_version}" / "prd.html"\n'
              '        if current_version\n'
              '        else project / "output" / "v<missing-version>" / "prd.html"\n'
              '    )\n'
              '    check(\n'
              '        "rendered_html_exists",\n'
              '        bool(current_version) and html_path.is_file(),\n'
              '        str(html_path) if current_version else "render-data.document.version is required to resolve the versioned prd.html",\n'
              '    )\n'
              '    if errors:\n'
              '        return {"status": "fail", "errors": errors, "warnings": warnings, "checks": checks}\n\n'
          )
          text = text.replace(marker, insert, 1)

          old = '    html_text = html_path.read_text(encoding="utf-8")\n'
          if text.count(old) != 1:
              raise SystemExit("validator html read marker not found exactly once")
          text = text.replace(old, '    assert html_path is not None\n    html_text = html_path.read_text(encoding="utf-8")\n', 1)
          text = text.replace(
              "rendered HTML is stale relative to work/render-data.json; rerender final.html",
              "rendered HTML is stale relative to work/render-data.json; rerender the current versioned prd.html",
          )

          # RQ-16: PRD core must stay exact and first; only valid Production Assets pages may follow.
          old = '''    expected = expected_page_ids(data)\n    actual_pages = facts.document_section_ids\n    exact_pages = actual_pages == expected\n    check(\n        "generated_page_set_matches_current_render_data",\n        exact_pages,\n        f"generated pages match expected order/set: {len(expected)} pages"\n        if exact_pages\n        else f"expected {expected}; actual {actual_pages}",\n    )\n'''
          new = '''    expected = expected_page_ids(data)\n    actual_pages = facts.document_section_ids\n    core_pages = actual_pages[: len(expected)]\n    downstream_pages = actual_pages[len(expected) :]\n    core_exact = core_pages == expected\n    invalid_downstream = [\n        section_id\n        for section_id in downstream_pages\n        if "production-assets-page" not in facts.section_classes.get(section_id, set())\n    ]\n    page_set_ok = core_exact and not invalid_downstream\n    if page_set_ok and downstream_pages:\n        page_detail = (\n            f"PRD core matches expected order/set: {len(expected)} pages; "\n            f"valid additive Production Assets pages: {len(downstream_pages)}"\n        )\n    elif page_set_ok:\n        page_detail = f"PRD core matches expected order/set: {len(expected)} pages; no downstream pages"\n    else:\n        page_detail = (\n            f"expected PRD core {expected}; actual prefix {core_pages}; "\n            f"invalid downstream pages {invalid_downstream}; actual pages {actual_pages}"\n        )\n    check(\n        "generated_page_set_matches_current_render_data",\n        page_set_ok,\n        page_detail,\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit("validator exact page-set block not found exactly once")
          text = text.replace(old, new, 1)
          write(rel, text)

          # Current contract fixtures use semantic version + versioned output.
          rel = "tests/test_prd_contracts.py"
          text = read(rel)
          renderer_marker = 'RENDERER = ROOT / "kits" / "project-document-generator" / "renderer" / "render.py"\n'
          if 'DELIVERY = ROOT / "kits" / "project-document-generator" / "renderer" / "delivery.py"' not in text:
              if text.count(renderer_marker) != 1:
                  raise SystemExit("test_prd_contracts RENDERER marker missing")
              text = text.replace(
                  renderer_marker,
                  renderer_marker + 'DELIVERY = ROOT / "kits" / "project-document-generator" / "renderer" / "delivery.py"\n',
                  1,
              )
          text = text.replace('"version": "1.0",', '"version": "1.0.0",')
          text = text.replace(
              'project / "output" / "final.html"',
              'project / "output" / "v1.0.0" / "prd.html"',
          )
          text = text.replace("output/final.html", "output/v1.0.0/prd.html")
          text = text.replace(
              'updated["document"]["version"] = "1.1"',
              'updated["overview"]["project_context"] = "Updated controlled fixture context."',
          )

          integration = '''\n    def test_versioned_delivery_and_flow4_validator_share_prd_path(self) -> None:\n        project = self.make_project(render_data())\n        delivered = run_cli(DELIVERY, project)\n        self.assertEqual(delivered.returncode, 0, delivered.stderr or delivered.stdout)\n        current_prd = project / "output" / "v1.0.0" / "prd.html"\n        self.assertTrue(current_prd.is_file(), current_prd)\n\n        validated = self.validate(project)\n        self.assertEqual(validated.returncode, 0, validated.stderr or validated.stdout)\n        payload = json.loads(validated.stdout)\n        rendered_check = next(\n            item for item in payload["checks"] if item["check"] == "rendered_html_exists"\n        )\n        self.assertIn("v1.0.0/prd.html", rendered_check["detail"].replace("\\\\", "/"))\n\n    def test_flow4_accepts_only_valid_additive_production_assets_pages(self) -> None:\n        project = self.make_project(render_data())\n        (project / "work" / "asset-requirements.md").write_text(\n            "# Production Asset Requirements\\n\\n"\n            "## Core Trial\\n\\n"\n            "### 3D Models\\n\\n"\n            "#### Trial Console\\n"\n            "Requirement: Create one readable trial console for the accepted Core Trial interaction.\\n",\n            encoding="utf-8",\n        )\n        delivered = run_cli(DELIVERY, project)\n        self.assertEqual(delivered.returncode, 0, delivered.stderr or delivered.stdout)\n        validated = self.validate(project)\n        self.assertEqual(validated.returncode, 0, validated.stderr or validated.stdout)\n        payload = json.loads(validated.stdout)\n        page_check = next(\n            item for item in payload["checks"]\n            if item["check"] == "generated_page_set_matches_current_render_data"\n        )\n        self.assertIn("valid additive Production Assets pages: 1", page_check["detail"])\n\n'''
          if "test_versioned_delivery_and_flow4_validator_share_prd_path" not in text:
              final_marker = '\n\nif __name__ == "__main__":\n'
              if text.count(final_marker) != 1:
                  raise SystemExit("test_prd_contracts final marker missing")
              text = text.replace(final_marker, integration + final_marker, 1)
          write(rel, text)

          rel = "tests/test_prd_flow2_state_contracts.py"
          text = read(rel).replace(
              'project / "output" / "final.html"',
              'project / "output" / "v1.0.0" / "prd.html"',
          )
          write(rel, text)

          # RQ-15: migration changed canonical content version text but missed the content binding.
          content_path = ROOT / "workspace/active/the-clockwork-vault/work/content.md"
          data_path = ROOT / "workspace/active/the-clockwork-vault/work/render-data.json"
          data = json.loads(data_path.read_text(encoding="utf-8"))
          actual_content_sha = hashlib.sha256(content_path.read_bytes()).hexdigest()
          previous = str(data.get("canonical_content_sha256") or "")
          if previous == actual_content_sha:
              pass
          else:
              data["canonical_content_sha256"] = actual_content_sha
              data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Update durable audit state only after the concrete source fixes are staged.
          rel = "docs/knowledge/reviews/repository-quality-audit-2026-08-14.md"
          text = read(rel)
          rows = {
              "| RQ-01 | P0 | Flow 4 mechanical validator still resolves `output/final.html` while current delivery is `output/v<document.version>/prd.html`. Existing tests also render `final.html`, so validator and tests can agree on the wrong contract. | False FAIL/PASS and broken real handoff validation. | OPEN — first fix |":
              "| RQ-01 | P0 | Flow 4 mechanical validator previously resolved the retired unversioned output while current delivery is `output/v<document.version>/prd.html`. | False FAIL/PASS and broken real handoff validation. | FIXED — versioned path resolution + integration proof |",
              "| RQ-15 | P0 | Clockwork `work/content.md` was changed during the semantic-version migration but `work/render-data.json.canonical_content_sha256` was not refreshed. Commit history shows both files changed in the migration, while the migration script changed the content version string without updating the canonical-content binding. | Current real project fails material projection-freshness validation even though the semantic projection itself was not intentionally revised. | OPEN — migration consistency fix |":
              "| RQ-15 | P0 | Clockwork semantic-version migration changed canonical content metadata without refreshing `canonical_content_sha256`. | Current real project fails projection-freshness validation despite unchanged gameplay meaning. | FIXED — canonical binding refreshed from current content bytes |",
              "| RQ-16 | P0 | Flow 4 `generated_page_set_matches_current_render_data` treats the PRD-core page set as the complete HTML page set and rejects valid additive `Production Assets` pages. | Any real project with downstream Production Assets can fail Flow 4 even when its PRD core and compositor output are valid. | OPEN — validator contract fix |":
              "| RQ-16 | P0 | Flow 4 page-set validation treated the PRD-core page set as the complete HTML page set and rejected valid additive Production Assets pages. | Real downstream projects could fail Flow 4 despite valid core/compositor output. | FIXED — exact PRD-core prefix + Production Assets-only downstream pages |",
          }
          for old, new in rows.items():
              if old not in text:
                  raise SystemExit(f"audit row missing: {old[:80]}")
              text = text.replace(old, new, 1)
          update = '''\n## Remediation update — P0 validator/delivery tranche\n\nRQ-01, RQ-15, and RQ-16 are staged for closure together because the real Clockwork proof showed they are one current validation boundary: resolve the versioned PRD, keep canonical content/projection binding current, and distinguish exact PRD core from valid additive Production Assets pages.\n\nThe proof for this tranche must include the normal PRD unit contracts plus real Clockwork Flow 4/handoff validation after deterministic delivery regeneration.\n\n'''
          if "## Remediation update — P0 validator/delivery tranche" not in text:
              marker = "## Ordered remediation\n"
              if text.count(marker) != 1:
                  raise SystemExit("audit Ordered remediation marker missing")
              text = text.replace(marker, update + marker, 1)
          write(rel, text)

          write("docs/knowledge/next-action.md", '''# Next Action\n\n## Current Status\n\n`REPOSITORY_QUALITY_P0_VALIDATOR_DELIVERY_FIXED`\n\nThe full repository quality audit remains at `docs/knowledge/reviews/repository-quality-audit-2026-08-14.md`. RQ-01, RQ-15, and RQ-16 are resolved as one bounded current-validation tranche: Flow 4 resolves the versioned PRD, the Clockwork migration binding is refreshed without changing gameplay meaning, and valid Production Assets pages are accepted only after the exact PRD core.\n\nAll remaining findings remain recorded and must not be executed as one broad refactor.\n\n## Next Step\n\nComplete **RQ-02 + RQ-03 + RQ-12 — current-context synchronization**: remove stale current semantic/procedure routing, make decision history explicitly safe to read, and activate the existing content-purity test in PRD CI.\n''')
          PY

      - name: Regenerate real Clockwork delivery
        run: |
          python kits/project-document-generator/renderer/delivery.py workspace/active/the-clockwork-vault

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check

      - name: Run P0 proof
        run: |
          python -m unittest \
            tests.test_prd_contracts \
            tests.test_prd_delivery \
            tests.test_prd_content_purity \
            tests.test_prd_voice_assets \
            tests.test_prd_handoff_contracts \
            tests.test_prd_flow2_state_contracts \
            tests.test_prd_hierarchy_contracts \
            tests.test_prd_golden_reference -v
          python kits/project-document-generator/validator/validate.py workspace/active/the-clockwork-vault
          python kits/project-document-generator/validator/validate_handoff.py workspace/active/the-clockwork-vault
          python kits/voice-production-kit/validator/validate.py workspace/active/the-clockwork-vault
          python tools/verify_repository.py

      - name: Commit P0 cleanup and self-delete workflow
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git rm .github/workflows/temp-repository-quality-cleanup-v2.yml
          git add -A
          git commit -m "fix: align Flow 4 with versioned delivery"
          git push origin HEAD:Local
