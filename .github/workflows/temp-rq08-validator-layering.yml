name: Temp RQ08 Validator Layering

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/temp-rq08-validator-layering.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove validator monkey-patch ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()
          wrapper_path = ROOT / "kits/project-document-generator/validator/validate.py"
          engine_path = ROOT / "kits/project-document-generator/validator/_engine.py"
          wrapper = wrapper_path.read_text(encoding="utf-8")
          engine = engine_path.read_text(encoding="utf-8")

          def block(text: str, name: str) -> str:
              start = text.find(f"def {name}(")
              if start < 0:
                  raise SystemExit(f"function not found: {name}")
              next_def = text.find("\ndef ", start + 1)
              if next_def < 0:
                  next_def = len(text)
              return text[start:next_def].rstrip() + "\n"

          def replace_function(text: str, name: str, replacement: str) -> str:
              old = block(text, name)
              if old not in text:
                  raise SystemExit(f"function replacement source missing: {name}")
              return text.replace(old, replacement.rstrip() + "\n", 1)

          def remove_function(text: str, name: str) -> str:
              old = block(text, name)
              return text.replace(old, "", 1)

          # Move current Golden-specific behavior into the actual engine instead of runtime monkey patches.
          if "PREVIEW_APPROVED_RE =" not in engine:
              marker = 'INTAKE_READY_RE = re.compile(r"(?mi)^\\s*ready_for_prd:\\s*(true|false)\\s*(?:#.*)?$")\n'
              if marker not in engine:
                  raise SystemExit("engine intake regex marker missing")
              engine = engine.replace(
                  marker,
                  marker + 'PREVIEW_APPROVED_RE = re.compile(r"(?mi)^\\s*preview_approved:\\s*(true|false)\\s*(?:#.*)?$")\n',
                  1,
              )

          if "GOLDEN_GLOBAL_PAGE_IDS =" not in engine:
              marker = "FLOW2_EXPLICIT_BLOCKERS = {\n"
              index = engine.find(marker)
              if index < 0:
                  raise SystemExit("engine blocker constant marker missing")
              close = engine.find("}\n\n", index)
              if close < 0:
                  raise SystemExit("engine blocker constant close missing")
              close += 3
              constant = '''\nGOLDEN_GLOBAL_PAGE_IDS = {\n    "development-overview": "development-overview",\n    "game-system": "shared-systems",\n    "data-reset": "shared-data-reset",\n    "gameplay-development": "phase-development",\n}\n\n'''
              engine = engine[:close] + constant + engine[close:]

          # flow2_readiness is copied with its current preview rule but without the wrapper/base indirection.
          current_flow = block(wrapper, "flow2_readiness")
          current_flow = current_flow.replace(
              "    ready, detail = _BASE_FLOW2_READINESS(path)\n    if not ready:\n        return ready, detail\n\n",
              '''    if not path.is_file():\n        return False, f"missing Flow 2 intake state: {path}"\n    text = path.read_text(encoding="utf-8")\n    statuses = INTAKE_STATUS_RE.findall(text)\n    readiness = INTAKE_READY_RE.findall(text)\n    if len(statuses) != 1 or len(readiness) != 1:\n        return False, "intake-state.yaml must define exactly one status and one ready_for_prd boolean"\n    status = statuses[0]\n    ready = readiness[0].lower() == "true"\n    if status != "ready_for_prd" or not ready:\n        return False, f"Flow 2 is not ready: status={status!r}, ready_for_prd={ready}"\n    detail = "Flow 2 intake state explicitly reports ready_for_prd"\n\n''',
              1,
          )
          current_flow = current_flow.replace(
              '    text = path.read_text(encoding="utf-8")\n    preview_flags = PREVIEW_APPROVED_RE.findall(text)\n',
              '    preview_flags = PREVIEW_APPROVED_RE.findall(text)\n',
              1,
          )
          engine = replace_function(engine, "flow2_readiness", current_flow)

          global_page = block(wrapper, "_global_page_id")
          if "def _global_page_id(" in engine:
              engine = replace_function(engine, "_global_page_id", global_page)
          else:
              marker = "def expected_page_ids("
              pos = engine.find(marker)
              if pos < 0:
                  raise SystemExit("engine expected_page_ids marker missing")
              engine = engine[:pos] + global_page + "\n" + engine[pos:]
          engine = replace_function(engine, "expected_page_ids", block(wrapper, "expected_page_ids"))
          engine = replace_function(
              engine,
              "document_composition_errors",
              block(wrapper, "document_composition_errors"),
          )
          engine_path.write_text(engine, encoding="utf-8")

          # The wrapper now owns only the narrow content-purity extension + CLI.
          for name in (
              "flow2_readiness",
              "_global_page_id",
              "expected_page_ids",
              "document_composition_errors",
          ):
              wrapper = remove_function(wrapper, name)
          constant_start = wrapper.find("GOLDEN_GLOBAL_PAGE_IDS = {")
          if constant_start >= 0:
              constant_end = wrapper.find("}\n", constant_start)
              if constant_end < 0:
                  raise SystemExit("wrapper GOLDEN_GLOBAL_PAGE_IDS close missing")
              wrapper = wrapper[:constant_start] + wrapper[constant_end + 2:]
          wrapper = wrapper.replace(
              'PREVIEW_APPROVED_RE = re.compile(r"(?mi)^\\s*preview_approved:\\s*(true|false)\\s*(?:#.*)?$")\n',
              "",
              1,
          )
          wrapper = wrapper.replace("_BASE_FLOW2_READINESS = _engine.flow2_readiness\n", "", 1)
          for line in (
              "_engine.flow2_readiness = flow2_readiness\n",
              "_engine.expected_page_ids = expected_page_ids\n",
              "_engine.document_composition_errors = document_composition_errors\n",
          ):
              wrapper = wrapper.replace(line, "", 1)
          for forbidden in (
              "_engine.flow2_readiness =",
              "_engine.expected_page_ids =",
              "_engine.document_composition_errors =",
              "_BASE_FLOW2_READINESS",
          ):
              if forbidden in wrapper:
                  raise SystemExit(f"validator monkey patch remains: {forbidden}")
          wrapper_path.write_text(wrapper, encoding="utf-8")

          # Focused architecture regression.
          test_path = ROOT / "tests/test_prd_contracts.py"
          text = test_path.read_text(encoding="utf-8")
          test = '''\n    def test_current_validator_does_not_monkey_patch_engine(self) -> None:\n        wrapper = (\n            ROOT / "kits" / "project-document-generator" / "validator" / "validate.py"\n        ).read_text(encoding="utf-8")\n        engine = (\n            ROOT / "kits" / "project-document-generator" / "validator" / "_engine.py"\n        ).read_text(encoding="utf-8")\n        for marker in (\n            "_engine.flow2_readiness =",\n            "_engine.expected_page_ids =",\n            "_engine.document_composition_errors =",\n            "_BASE_FLOW2_READINESS",\n        ):\n            self.assertNotIn(marker, wrapper)\n        self.assertIn("PREVIEW_APPROVED_RE", engine)\n        self.assertIn("def _global_page_id(", engine)\n        self.assertIn("quarry-overview-table", engine)\n\n'''
          if "test_current_validator_does_not_monkey_patch_engine" not in text:
              final_marker = '\n\nif __name__ == "__main__":\n'
              if final_marker not in text:
                  raise SystemExit("test_prd_contracts final marker missing")
              text = text.replace(final_marker, test + final_marker, 1)
          test_path.write_text(text, encoding="utf-8")

          # Ownership text remains intentionally simple: engine owns mechanics, wrapper owns narrow purity check/CLI.
          rel = ROOT / "docs/knowledge/ownership.md"
          text = rel.read_text(encoding="utf-8")
          old = "| PRD mechanical validator | `kits/project-document-generator/validator/validate.py` |"
          new = "| PRD mechanical validator | `kits/project-document-generator/validator/_engine.py` core mechanics + `validator/validate.py` narrow content-purity/CLI wrapper |"
          if old not in text:
              raise SystemExit("ownership mechanical validator row missing")
          rel.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Durable tracking.
          audit_path = ROOT / "docs/knowledge/reviews/repository-quality-audit-2026-08-14.md"
          text = audit_path.read_text(encoding="utf-8")
          old = "| RQ-08 | P2 | Current validator behavior is layered by monkey-patching functions in `validator/_engine.py` from `validator/validate.py`; the old engine still carries stale assumptions. | Patch accumulation makes legacy assumptions easy to miss and hard to retire. | OPEN |"
          new = "| RQ-08 | P2 | Current validator behavior was layered by monkey-patching `_engine.py` from `validate.py`. | Patch accumulation made current ownership easy to miss. | FIXED — current Golden/readiness mechanics live directly in `_engine.py`; wrapper only adds purity/CLI |"
          if old not in text:
              raise SystemExit("RQ-08 audit row missing")
          text = text.replace(old, new, 1)
          update = "## Remediation update — RQ-08 validator layering\n\nThe validator was not rewritten. The three current overrides were moved into the existing mechanical engine and runtime monkey-patch assignments were removed. `validate.py` remains a narrow content-purity/CLI wrapper. This closes the patch-on-patch ownership defect without introducing hooks, profiles, or another validator layer.\n\n"
          if "## Remediation update — RQ-08 validator layering" not in text:
              marker = "## Ordered remediation\n"
              if marker not in text:
                  raise SystemExit("audit Ordered remediation marker missing")
              text = text.replace(marker, update + marker, 1)
          audit_path.write_text(text, encoding="utf-8")

          backlog_path = ROOT / "docs/knowledge/operations/backlog.md"
          text = backlog_path.read_text(encoding="utf-8")
          line = "1. **RQ-08 — validator layering simplification (P2):** after current behavior above is stable, remove monkey-patch ownership incrementally so one current validator owns behavior. Do not rewrite the validator wholesale.\n"
          if line not in text:
              raise SystemExit("backlog RQ-08 line missing")
          text = text.replace(line, "", 1)
          text = text.replace("2. **RQ-09", "1. **RQ-09", 1)
          text = text.replace("3. **RQ-10", "2. **RQ-10", 1)
          text = text.replace("4. **RQ-14", "3. **RQ-14", 1)
          text = text.replace(
              "Closed items RQ-01, RQ-02, RQ-03, RQ-04, RQ-05, RQ-06, RQ-07, RQ-12, RQ-13, RQ-15, and RQ-16",
              "Closed items RQ-01, RQ-02, RQ-03, RQ-04, RQ-05, RQ-06, RQ-07, RQ-08, RQ-12, RQ-13, RQ-15, and RQ-16",
              1,
          )
          backlog_path.write_text(text, encoding="utf-8")

          next_path = ROOT / "docs/knowledge/next-action.md"
          next_path.write_text('''# Next Action\n\n## Current Status\n\n`REPOSITORY_QUALITY_ACTIVE_REMEDIATION_COMPLETE`\n\nThe full audit remains durable at `docs/knowledge/reviews/repository-quality-audit-2026-08-14.md`. All proven active/current-context defects selected for this remediation are closed through RQ-08. Remaining findings are conditional or design-sensitive and stay in `docs/knowledge/operations/backlog.md`; they are not a mandate for speculative refactoring.\n\nThe visible Production Assets footer-code change from RQ-05/RQ-13 still needs actual browser inspection before refreshed visual PASS is claimed.\n\n## Next Step\n\nPerform one targeted browser visual check of the current Clockwork Production Assets pages for the new `PA-##` footer codes; if readable with no layout regression, record the proof and return to normal next project work.\n''', encoding="utf-8")
          PY

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check

      - name: Verify validator behavior unchanged
        run: |
          python -m unittest \
            tests.test_prd_contracts \
            tests.test_prd_content_purity \
            tests.test_prd_flow2_state_contracts \
            tests.test_prd_hierarchy_contracts \
            tests.test_prd_golden_reference -v
          python kits/project-document-generator/validator/validate.py workspace/active/the-clockwork-vault
          python kits/project-document-generator/validator/validate_handoff.py workspace/active/the-clockwork-vault
          python tools/verify_repository.py

      - name: Commit and self-delete workflow
        run: |
          git config user.name "halokaryamedia-source"
          git config user.email "halokaryamedia@gmail.com"
          git rm .github/workflows/temp-rq08-validator-layering.yml
          git add -A
          git commit -m "refactor: remove validator monkey patch layering"
          git push origin HEAD:Local
