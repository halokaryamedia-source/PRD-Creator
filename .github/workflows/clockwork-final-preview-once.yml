name: Clockwork Final Preview Once

on:
  push:
    branches: [Local]
    paths:
      - ".tmp-final-preview/READY"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check
      - name: Rerender final HTML
        run: python kits/project-document-generator/renderer/delivery.py workspace/active/the-clockwork-vault/
      - name: Validate final PRD and Voice
        run: |
          python kits/project-document-generator/validator/validate.py workspace/active/the-clockwork-vault/
          python kits/project-document-generator/validator/validate_handoff.py workspace/active/the-clockwork-vault/
          python kits/voice-production-kit/validator/validate.py workspace/active/the-clockwork-vault/
      - name: Lock Gremlin voice selection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('workspace/active/the-clockwork-vault/state/voice-state.yaml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('gremlin_voice_selection: pending_actual_elevenlabs_voice','gremlin_voice_selection: The Cheeky Trickster')
          s=s.replace('next_step: select_gremlin_voice_then_optional_generation_mode','next_step: optional_generation_mode_or_audio_review')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Cleanup one-shot tooling
        run: |
          rm -rf .tmp-final-preview
          rm -f .github/workflows/clockwork-final-preview-once.yml
      - name: Commit final preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "finalize Clockwork HTML preview with selected Gremlin voice"
          git push origin HEAD:Local
