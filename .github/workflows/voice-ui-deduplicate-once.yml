name: Voice UI Deduplicate Once

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/voice-ui-deduplicate-once.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip install --disable-pip-version-check selenium==4.35.0

      - name: Remove redundant Voice page eyebrow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('kits/project-document-generator/renderer/production_assets.py')
          source = path.read_text(encoding='utf-8')
          old = '''        body = f'<p class="eyebrow">{i18n(bi("Production Assets · Voice", "Aset Produksi · Voice"))}</p>'\n'''
          new = '''        body = ""\n'''
          if source.count(old) != 1:
              raise SystemExit('expected one Voice page eyebrow owner')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run focused contract
        run: |
          python -m compileall -q kits/project-document-generator/renderer tests/test_prd_voice_assets.py
          python -m unittest tests.test_prd_voice_assets

      - name: Render and validate Clockwork
        run: |
          python kits/project-document-generator/renderer/render.py \
            workspace/active/the-clockwork-vault/work/render-data.json \
            workspace/active/the-clockwork-vault/output/final.html
          python kits/voice-production-kit/validator/validate.py \
            workspace/active/the-clockwork-vault

      - name: Capture final Voice preview
        run: |
          python - <<'PY'
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import time

          html = Path('workspace/active/the-clockwork-vault/output/final.html').resolve().as_uri()
          out = Path('voice-ui-final-preview')
          out.mkdir(exist_ok=True)
          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--hide-scrollbars')
          options.add_argument('--window-size=1600,1400')
          driver = webdriver.Chrome(options=options)
          try:
              driver.get(html)
              driver.set_window_size(1600, 1400)
              time.sleep(.3)
              for filename, target_id in [
                  ('01-antechamber.png', 'production-assets-voice-1'),
                  ('02-workshop.png', 'production-assets-voice-5'),
              ]:
                  driver.execute_script("""
                    const target = document.getElementById(arguments[0]);
                    document.querySelectorAll('main.document-main > section.sheet').forEach(function(el){
                      el.style.setProperty('display', el === target ? 'block' : 'none', 'important');
                    });
                    document.body.classList.remove('view-clean');
                    document.body.classList.add('view-professional');
                    window.scrollTo(0,0);
                  """, target_id)
                  time.sleep(.15)
                  driver.save_screenshot(str(out / filename))
          finally:
              driver.quit()
          PY

      - name: Upload final preview images
        uses: actions/upload-artifact@v4
        with:
          name: voice-ui-final-preview
          path: voice-ui-final-preview/*.png
          if-no-files-found: error
          retention-days: 1

      - name: Commit final UI refinement and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kits/project-document-generator/renderer/production_assets.py workspace/active/the-clockwork-vault/output/final.html
          git rm .github/workflows/voice-ui-deduplicate-once.yml
          git commit -m "ui: remove redundant Voice page label"
          git push origin HEAD:Local
