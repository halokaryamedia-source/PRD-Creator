name: Voice UI Preview Once

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/voice-ui-preview-once.yml"

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip install --disable-pip-version-check selenium==4.35.0

      - name: Render Clockwork project HTML
        run: |
          python kits/project-document-generator/renderer/render.py \
            workspace/active/the-clockwork-vault/work/render-data.json \
            workspace/active/the-clockwork-vault/output/final.html

      - name: Validate current Voice package
        run: |
          python kits/voice-production-kit/validator/validate.py \
            workspace/active/the-clockwork-vault

      - name: Capture direct Voice previews
        run: |
          python - <<'PY'
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import time

          html = Path('workspace/active/the-clockwork-vault/output/final.html').resolve().as_uri()
          out = Path('voice-ui-preview')
          out.mkdir(exist_ok=True)

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--hide-scrollbars')
          options.add_argument('--window-size=1600,1400')

          driver = webdriver.Chrome(options=options)
          try:
              driver.get(html)
              driver.set_window_size(1600, 1400)
              time.sleep(.35)
              targets = [
                  ('01-antechamber.png', 'production-assets-voice-1'),
                  ('02-workshop.png', 'production-assets-voice-5'),
              ]
              for filename, target_id in targets:
                  driver.execute_script("""
                    const target = document.getElementById(arguments[0]);
                    document.querySelectorAll('main.document-main > section.sheet').forEach(function(el){
                      el.style.setProperty('display', el === target ? 'block' : 'none', 'important');
                    });
                    document.body.classList.remove('view-clean');
                    document.body.classList.add('view-professional');
                    window.scrollTo(0, 0);
                  """, target_id)
                  time.sleep(.2)
                  driver.save_screenshot(str(out / filename))
          finally:
              driver.quit()
          PY

      - name: Upload preview images
        uses: actions/upload-artifact@v4
        with:
          name: voice-ui-preview
          path: voice-ui-preview/*.png
          if-no-files-found: error
          retention-days: 1

      - name: Commit current HTML and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workspace/active/the-clockwork-vault/output/final.html
          git rm .github/workflows/voice-ui-preview-once.yml
          git commit -m "ui: render refined Clockwork Voice presentation"
          git push origin HEAD:Local
