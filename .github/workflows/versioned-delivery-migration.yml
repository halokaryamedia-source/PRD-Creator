name: Versioned Delivery Migration

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/versioned-delivery-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sources and dependencies
        run: |
          base64 -d .github/versioned-delivery-sources.tgz.b64 > /tmp/sources.tgz
          tar -xzf /tmp/sources.tgz -C .
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check

      - name: Migrate owners and generate Clockwork delivery
        run: |
          python .github/versioned-delivery-context-fix.py
          python .github/versioned-delivery-migrate.py
          python kits/project-document-generator/renderer/delivery.py workspace/active/the-clockwork-vault/
          rm -f workspace/active/the-clockwork-vault/output/final.html
          rm -f workspace/active/the-clockwork-vault/output/team-handoff.md

      - name: Verify delivery economy
        run: |
          python -c "import json; from pathlib import Path; p=Path('workspace/active/the-clockwork-vault/output'); b=p/'v1.0.0'; files=[p/'README.md',b/'prd.html',b/'context.md',b/'index.json']; assert all(x.is_file() for x in files); assert (b/'index.json').stat().st_size < (b/'context.md').stat().st_size; d=json.loads((b/'index.json').read_text()); assert d['project']['prd_version']=='1.0.0'; t=(b/'context.md').read_text(); assert all(x in t for x in ['The Broken Gallery','Developer','Voice Requirements'])"
          ! grep -R "output/final.html" workspace/active/the-clockwork-vault --include='*.md' --include='*.yaml' --include='*.json' --include='*.html'

      - name: Verify contracts
        run: |
          python -m compileall -q kits tools tests
          python -m unittest tests.test_prd_contracts tests.test_prd_delivery tests.test_prd_voice_assets tests.test_prd_handoff_contracts tests.test_prd_flow2_state_contracts tests.test_prd_hierarchy_contracts tests.test_prd_golden_reference tests.test_voice_contracts -v
          python kits/project-document-generator/validator/validate_handoff.py workspace/active/the-clockwork-vault/
          python kits/voice-production-kit/validator/validate.py workspace/active/the-clockwork-vault/
          python tools/verify_repository.py

      - name: Commit migration
        run: |
          git checkout -- .github/workflows/prd-verify.yml
          git rm .github/versioned-delivery-sources.tgz.b64
          git rm .github/versioned-delivery-migrate.py
          git rm .github/versioned-delivery-context-fix.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add versioned AI-ready PRD delivery"
          git push origin HEAD:Local
