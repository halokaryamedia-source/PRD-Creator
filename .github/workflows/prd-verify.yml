name: PRD Verify

on:
  push:
    branches:
      - Local
    paths:
      - "kits/prd-creator/intake/**/*.py"
      - "kits/prd-creator/document/**/*.py"
      - "kits/prd-creator/production-assets/**/*.py"
      - "kits/prd-creator/renderer/**/*.py"
      - "kits/prd-creator/template/**"
      - "kits/prd-creator/validator/_engine.py"
      - "kits/prd-creator/validator/validate.py"
      - "kits/prd-creator/validator/validate_handoff.py"
      - "tests/test_prd_*.py"
      - "requirements.lock.txt"
      - ".github/workflows/prd-verify.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: PRD contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          python -m pip check

      # test_prd_voice_assets includes the additive 04 / protected-core regression.
      - name: Compile PRD sources
        run: |
          python -m compileall -q \
            kits/prd-creator/renderer \
            kits/prd-creator/validator/_engine.py \
            kits/prd-creator/validator/validate.py \
            kits/prd-creator/validator/validate_handoff.py \
            tests/test_prd_contracts.py \
            tests/test_prd_content_purity.py \
            tests/test_prd_delivery.py \
            tests/test_prd_voice_assets.py \
            tests/test_prd_handoff_contracts.py \
            tests/test_prd_flow2_state_contracts.py \
            tests/test_prd_hierarchy_contracts.py \
            tests/test_prd_golden_reference.py

      - name: Project Document contracts
        run: |
          python -m unittest \
            tests.test_prd_contracts \
            tests.test_prd_content_purity \
            tests.test_prd_delivery \
            tests.test_prd_voice_assets \
            tests.test_prd_handoff_contracts \
            tests.test_prd_flow2_state_contracts \
            tests.test_prd_hierarchy_contracts \
            tests.test_prd_golden_reference -v
