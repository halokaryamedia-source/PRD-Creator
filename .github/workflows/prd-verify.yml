name: PRD Verify

on:
  push:
    branches:
      - develop
      - Local
    paths:
      - "kits/prd-creator/intake/**/*.py"
      - "kits/prd-creator/document/**/*.py"
      - "kits/prd-creator/production-assets/**/*.py"
      - "kits/prd-creator/renderer/**/*.py"
      - "kits/prd-creator/shared/**/*.py"
      - "kits/prd-creator/template/**"
      - "kits/prd-creator/validator/**/*.py"
      - "tests/test_prd_*.py"
      - "requirements.lock.txt"
      - "requirements-dev.lock.txt"
      - "pyproject.toml"
      - ".github/workflows/prd-verify.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: PRD contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock.txt -r requirements-dev.lock.txt
          python -m pip check

      - name: Static quality
        run: |
          ruff check \
            kits/prd-creator/shared \
            kits/prd-creator/validator \
            kits/prd-creator/renderer/render.py \
            kits/prd-creator/renderer/delivery.py \
            kits/prd-creator/renderer/production_assets.py \
            kits/prd-creator/renderer/production_assets_compositor.py
          mypy kits/prd-creator/shared

      - name: Compile PRD sources
        run: python -m compileall -q kits/prd-creator tests

      - name: Project Document contracts
        run: |
          coverage run -m unittest discover -s tests -p "test_prd_*.py" -v
          coverage report
