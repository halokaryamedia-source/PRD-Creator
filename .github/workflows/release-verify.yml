name: Release Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Stable release gate
    runs-on: ubuntu-latest

    steps:
      - name: Require Local release source
        if: github.event_name == 'pull_request'
        run: |
          test "${{ github.head_ref }}" = "Local" || {
            echo "Stable release promotion must come from Local." >&2
            exit 1
          }

      - name: Checkout release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock.txt -r requirements-dev.lock.txt
          python -m pip check

      - name: Verify repository contracts
        run: python tools/verify_repository.py

      - name: Static quality
        run: |
          ruff format --check kits/prd-creator tests tools
          ruff check kits/prd-creator tests tools
          mypy kits/prd-creator/shared kits/prd-creator/renderer kits/prd-creator/validator

      - name: Run full regression suite
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py" -v
          coverage report

      - name: Release policy reminder
        if: github.event_name == 'pull_request'
        run: |
          echo "Release source: Local."
          echo "Required merge method: merge commit."
          echo "This gate validates GitHub's pull-request merge candidate."
          echo "Do not merge main release-marker commits back into Local merely to satisfy ancestry."
