name: Local Promotion Verify

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/local-promotion-verify.yml"
      - ".github/workflows/release-verify.yml"
      - "tests/test_prd_browser_verify.py"
      - "tests/test_repository_verify.py"
      - "tools/browser_verify.py"
      - "tools/verify_repository.py"
  pull_request:
    branches:
      - Local
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Local promotion gate
    runs-on: ubuntu-latest

    steps:
      - name: Require develop promotion source
        if: github.event_name == 'pull_request'
        run: |
          test "${{ github.head_ref }}" = "develop" || {
            echo "Local promotion must come from develop." >&2
            exit 1
          }

      - name: Checkout candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock.txt -r requirements-dev.lock.txt
          python -m pip check

      - name: Verify repository contracts
        run: python tools/verify_repository.py

      - name: Static quality
        run: |
          ruff format --check kits/prd-creator tests tools
          ruff check kits/prd-creator tests tools
          mypy kits/prd-creator/shared kits/prd-creator/renderer kits/prd-creator/validator

      - name: Run full regression suite
        env:
          PRD_BROWSER_TEST: "1"
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py" -v
          coverage report --fail-under=84

      - name: Promotion policy reminder
        if: github.event_name == 'pull_request'
        run: |
          echo "Required merge method: squash."
          echo "One approved develop -> Local promotion must create exactly one new Local commit."
          echo "After merge, synchronize develop to the resulting Local HEAD before new development."
