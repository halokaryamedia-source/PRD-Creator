name: Local Promotion Verify

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - Local
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Local promotion gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require approved Local promotion source
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ github.head_ref }}" = "develop" ]; then
            exit 0
          fi
          case "${{ github.head_ref }}" in
            local-*) ;;
            *)
              echo "Local promotion must come from develop or a bounded local-* milestone branch." >&2
              exit 1
              ;;
          esac
          git fetch origin Local
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/Local)" || {
            echo "A local-* milestone must contain exactly one commit whose parent is current Local." >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock.txt -r requirements-dev.lock.txt
          python -m pip check

      - name: Verify repository contracts
        run: python tools/verify_repository.py

      - name: Static quality
        run: |
          ruff check kits/prd-creator/shared kits/prd-creator/validator kits/prd-creator/renderer
          mypy kits/prd-creator/shared kits/prd-creator/validator/api.py

      - name: Run full regression suite
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py" -v
          coverage report

      - name: Promotion policy reminder
        if: github.event_name == 'pull_request'
        run: |
          echo "Required merge method: squash."
          echo "One approved promotion must create exactly one new Local commit."
          echo "After merge, synchronize develop to the resulting Local HEAD before new development."
