terms:
- id: required_ore
  term:
    id: Required Ore
    en: Required Ore
  definition:
    id: Jumlah minimum ore yang harus diproses sebelum cave berikutnya terbuka.
    en: The minimum amount of ore that must be processed before the next cave opens.
  scope: quarry
  aliases:
    id:
    - ore wajib
    en:
    - mandatory ore
  status: approved
  index_only: false
  source_refs:
  - type: decision
    ref: D-001
- id: beacon_core
  term:
    id: Beacon Core
    en: Beacon Core
  definition:
    id: Core yang dibuat oleh The Forge dan dibawa ke objective berikutnya.
    en: The core created by The Forge and carried to the next objective.
  scope: project
  aliases:
    id: []
    en: []
  status: approved
  index_only: false
- id: communicator
  term:
    id: Communicator
    en: Communicator
  definition:
    id: Item tetap untuk membuka pesan dan aksi sesi.
    en: A persistent item used to open messages and session actions.
  scope: project
  aliases:
    id: []
    en: []
  status: approved
  index_only: false
- id: automatic_lift
  term:
    id: Automatic Lift
    en: Automatic Lift
  definition:
    id: Lift utama yang menghubungkan Forge Hub dan cave aktif.
    en: The main lift connecting Forge Hub and the active cave.
  scope: quarry
  aliases:
    id:
    - lift otomatis
    en:
    - lift
  status: approved
  index_only: false
- id: the_forge
  term:
    id: The Forge
    en: The Forge
  definition:
    id: Mesin utama yang memproses ore dan membuat Beacon Core.
    en: The main machine that processes ore and creates the Beacon Core.
  scope: quarry
  aliases:
    id:
    - forge
    en:
    - forge
  status: approved
  index_only: false
- id: session
  term:
    id: Session
    en: Session
  definition:
    id: Satu perjalanan gameplay milik satu player.
    en: One gameplay journey owned by one player.
  scope: project
  aliases:
    id:
    - sesi
    en: []
  status: approved
  index_only: false
- id: assigned_arena
  term:
    id: Assigned Arena
    en: Assigned Arena
  definition:
    id: Arena terpisah yang dimiliki satu Session.
    en: A separate arena owned by one Session.
  scope: project
  aliases:
    id:
    - arena terpilih
    en:
    - session arena
  status: approved
  index_only: false
- id: multi_session
  term:
    id: Multi Session
    en: Multi Session
  definition:
    id: Beberapa player bermain bersamaan dengan state yang terpisah.
    en: Multiple players play concurrently with isolated state.
  scope: project
  aliases:
