<div class="production-table-wrap"><table class="data-table"><tbody>
{% for row in rows %}
<tr><th><span class="i18n-text" data-en="{{ row.label.en }}" data-id="{{ row.label.id }}">{{ row.label.en }}</span></th><td><span class="i18n-text" data-en="{{ row.value.en }}" data-id="{{ row.value.id }}">{{ row.value.en }}</span></td></tr>
{% endfor %}
</tbody></table></div>
