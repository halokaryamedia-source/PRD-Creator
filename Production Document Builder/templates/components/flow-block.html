<div class="flow {{ flow_class }}">
{% for step in steps %}
<article><span class="flow-number">{{ step.number }}</span><h4><span class="i18n-text" data-en="{{ step.title.en }}" data-id="{{ step.title.id }}">{{ step.title.en }}</span></h4><p><span class="i18n-text" data-en="{{ step.description.en }}" data-id="{{ step.description.id }}">{{ step.description.en }}</span></p></article>
{% endfor %}
</div>
