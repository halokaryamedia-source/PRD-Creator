project: the-clockwork-vault
requirements:
  - id: REQ-001
    area: gameplay
    statement: The Antechamber remains story briefing, Custodian Key pickup, and Resonance Engine seal activation; it adds no separate warm-up puzzle or Objective Score.
    provenance: [SRC-001, SRC-002, SRC-006]
    evidence_status: supported
    recovery_class: proposal
    approval_status: approved
    impact: high
  - id: REQ-002
    area: gameplay
    statement: Objective 1 targets approximately 9 minutes and uses three puzzle pillars. Each pillar has an upper lever, lower lever, pressure plate, and colored indicator lamp. Lever state is read upper then lower with four possible combinations; the matching pressure plate controls only steady versus pulsing/blinking and does not change color. The exit display reveals only the middle target color Brown, so the player must use scattered books to discover the missing left/right target colors and which pillar must pulse, then use lever experimentation and immediate lamp feedback to produce the required colors.
    provenance: [SRC-004, SRC-006, SRC-007]
    evidence_status: supported
    recovery_class: none
    approval_status: not_required
    impact: high
  - id: REQ-003
    area: gameplay
    statement: Objective 2 targets approximately 9 minutes and is divided into three checkpoints with three route choices each. Level 1 has two viable routes and requires 12 blocks for a viable crossing. Level 2 has one viable route and requires 20 blocks plus 3 ladders. Placement is allowed only on authored marked positions. Wrong-route resource exhaustion or the configured time limit returns the player to that level checkpoint and resets placed resources for another attempt.
    provenance: [SRC-004, SRC-006]
    evidence_status: supported
    recovery_class: none
    approval_status: not_required
    impact: high
  - id: REQ-004
    area: gameplay
    statement: Objective 2 Level 3 makes all three routes initially viable but requires the player to reach at least 50 percent of the chosen route before the authored time threshold. Failure returns the player to Checkpoint 3, closes the failed route for that run while another alternative remains, requires resource search again, and leaves the remaining active routes available.
    provenance: [SRC-004, SRC-006]
    evidence_status: supported
    recovery_class: none
    approval_status: not_required
    impact: high
  - id: REQ-005
    area: gameplay
    statement: Objective 3 uses three trap checkpoints. Wall laser traps can be passed by timing or temporarily disabled with Echo Pebble for the previously accepted 4-second game-time window; Pebble may also knock an authored hanging stone into a beam to block it. Floor traps and swinging ceiling axes cannot be disabled with Pebble and must be avoided or timed. Echo Pebble supply is unlimited with a 3-second cooldown between throws.
    provenance: [SRC-001, SRC-004, SRC-006]
    evidence_status: supported
    recovery_class: completion
    approval_status: approved
    resolution: The current clarification says Objective 3 gameplay remains the same while specifying Pebble scope and a 3-second throw cooldown; therefore the previously accepted 4-second wall-laser disable duration remains current where not replaced.
    impact: high
  - id: REQ-006
    area: gameplay
    statement: Objective 3 hazard consequences follow the current source values. Laser contact applies 10 gameplay damage, Weakness II for 5 seconds, and Slowness I for 3 seconds. Floor-trap contact applies 5 gameplay damage, Slowness II for 5 seconds, and Blindness for 3 seconds. Swinging-axe contact applies 10 gameplay damage, backward knockback, Weakness II for 5 seconds, and Slowness I for 3 seconds. If gameplay health reaches zero, the player returns to the current level checkpoint. This objective is an explicit exception to the earlier global no-death assumption.
    provenance: [SRC-004, SRC-006]
    evidence_status: supported
    recovery_class: none
    approval_status: not_required
    impact: high
  - id: REQ-007
    area: gameplay
    statement: Objective 4 targets approximately 9 minutes and uses one continuous power network from Power Generator to Ring 1, then Ring 2, then Ring 3. Junction rotators are 90-degree L connectors that route power through one valid active path. The technical grid coordinates and layout remain outside the PRD and belong in a later supporting technical document.
    provenance: [SRC-004, SRC-005, SRC-006]
    evidence_status: supported
    recovery_class: none
    approval_status: not_required
    impact: high
  - id: REQ-008
    area: gameplay
    statement: Objective 4 has staged Gremlin sabotage. About 20 seconds after Ring 1 and Ring 2 are connected, the active route is blocked and a previously blocked alternate route opens. During Ring 2 to Ring 3 progression, reaching 50 percent changes two rotators on the Power Generator to Ring 1 route; reaching 80 percent changes three rotators on the Ring 1 to Ring 2 route. The player must repair those earlier connections and finish with Generator, Ring 1, Ring 2, and Ring 3 continuously connected; completion opens the Clockwork exit.
    provenance: [SRC-004, SRC-005, SRC-006]
    evidence_status: supported
    recovery_class: none
    approval_status: not_required
    impact: high
  - id: REQ-009
    area: gameplay
    statement: Objective 1 lever-to-color behavior remains fixed by the approved list-order mapping: ON/ON to color 1, OFF/OFF to color 2, ON/OFF to color 3, and OFF/ON to color 4. Right pillar colors are Red, Yellow, Green, Purple; middle pillar colors are Blue, Dark Blue, Brown, Dark Green; left pillar colors are Pink, Orange, White, Black. This mapping is machine behavior discovered through experimentation and immediate feedback; it is not the information that the twelve clue books directly explain.
    provenance: [SRC-004, SRC-006, SRC-007]
    evidence_status: approved
    recovery_class: proposal
    approval_status: approved
    resolution: User approved the list-order mapping on 2026-08-15, then clarified that the books should reveal the required final target rather than teach all twelve mapping entries.
    impact: high
  - id: REQ-010
    area: scoring
    statement: The four objectives retain the existing 0-100 Objective Score boundary, but scoring evidence must be updated to the revised mechanics rather than old Target 1/Target 2, old collapse, old floor-trap disable, or single-fault Workshop assumptions. Existing component-weight families may be retained where their meaning still applies. The map continues to emit raw evidence only and does not display or export the calculated final score.
    provenance: [SRC-001, SRC-002, SRC-004, SRC-006]
    evidence_status: supported
    recovery_class: completion
    approval_status: approved
    impact: high
  - id: REQ-011
    area: production-assets
    statement: Production Asset preparation covers all custom player-visible, readable, heard, and authored presentation needs implied by the revised gameplay, including Objective 1 clue books and instruction UI, Objective 2 route/checkpoint/time-challenge information, Objective 3 Echo Pebble/trap assets and instruction UI, Objective 4 power-routing and Gremlin-event assets, and revised Voice Production. The Objective 4 technical layout itself is not a PRD Production Asset page.
    provenance: [SRC-004, SRC-006]
    evidence_status: supported
    recovery_class: none
    approval_status: not_required
    impact: high
  - id: REQ-012
    area: result
    statement: The ending retains the Clockwork Wayfinder one-time reward, adds no fifth Objective Score, and keeps idempotent reward and completion-save behavior unless a later user instruction changes the ending.
    provenance: [SRC-001, SRC-002]
    evidence_status: supported
    recovery_class: none
    approval_status: not_required
    impact: high
  - id: REQ-013
    area: document-content
    statement: Project-facing PRD copy describes player, gameplay, and production behavior without exposing the Objective 4 coordinate grid, HTML preview controls, Golden/page-contract/renderer/validator mechanics, or other document-production internals. Material gameplay meaning must not be deleted during Humanize cleanup.
    provenance: [SRC-002, SRC-006]
    evidence_status: supported
    recovery_class: none
    approval_status: not_required
    impact: high
  - id: REQ-014
    area: gameplay
    statement: The authored Objective 1 door solution is Left = Orange, Middle = Brown, Right = Purple. Only the Left pressure plate is active, so Left pulses/blinks while Middle and Right remain steady. The exit display reveals only Middle = Brown; the other two colors and pulse location remain unknown until inferred from the scattered books.
    provenance: [SRC-007]
    evidence_status: approved
    recovery_class: none
    approval_status: not_required
    impact: high
  - id: REQ-015
    area: production-assets
    statement: Objective 1 uses twelve books scattered around the chamber with no required reading order: two mechanic-rule books, eight useful clues, and two harmless decoys. The two rule books explain TOP-to-BOTTOM lever reading and that pressure plates control pulse rather than color. The eight useful clues are independent, easy-to-understand hints that collectively narrow Left to Orange, Right to Purple, and Pulse to Left without stating those answers directly. The two decoys are ordinary maintenance/lore notes and must not contain false puzzle information. Finding useful books earlier by chance is valid player luck; completion must not require reading all twelve books.
    provenance: [SRC-007]
    evidence_status: approved
    recovery_class: none
    approval_status: not_required
    impact: high
  - id: REQ-016
    area: voice-production
    statement: Gremlin is an additional speaking character for authored sabotage and challenge moments, including the Broken Gallery final crossing and Objective 4. Custodian Vex remains the primary narrative guide. Voice exists for story, character, atmosphere, reaction, and light in-world hints; it must not become a spoken copy of Development mechanics. Gremlin dialogue adds personality and sabotage acknowledgement without revealing solutions or internal implementation state.
    provenance: [SRC-008]
    evidence_status: approved
    recovery_class: none
    approval_status: not_required
    impact: medium

  - id: REQ-024
    area: production-assets
    statement: Section 04 is a universal, humanized, moment-first production brief. Use plain, literal language and remove AI-style filler, speculative visual details, and unnecessary metadata. Echo Pebble is a normal stone. Visual resources render as TYPE, resource name, Function, Visual Brief, and optional Size only when a real approved size exists; animation and visual changes stay in the Visual Brief rather than generic States/Position/Orientation/Reuse fields. UI / TEXT renders Function plus exact player copy. AUDIO dialogue renders Function, Voice Preset, ElevenLabs Model, Estimated Duration, and exact Prompt with performance-direction tags visually separated from spoken lines; non-dialogue AUDIO renders Function plus Audio Brief. Type appears above the resource title. Moment and asset names use reader-friendly gameplay wording, not internal labels such as Rollback. The body must not duplicate the Production Assets page header. Section 03 Development is frozen and must not be edited by Section 04 work.
    provenance: [SRC-018]
    evidence_status: approved
    recovery_class: none
    approval_status: not_required
    impact: high
