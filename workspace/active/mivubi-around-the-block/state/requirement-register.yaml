    statement: Flying Motorcycle requires Motorcycle Body, Engine, Flight Module, and Fuel.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-023
    area: purchasable_items
    statement: Dealer NPC explains that the motorcycle is purchased/assembled per part using the approved installment satire.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-024
