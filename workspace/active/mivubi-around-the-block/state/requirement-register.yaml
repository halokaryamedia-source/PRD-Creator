version: 1.0.0
project: Around The Block
requirements:
  - id: REQ-001
    area: global
    statement: Around The Block has two separate gameplay types: Multiplayer Gameplay and Singleplayer Motion Tracking.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-002
    area: global
    statement: Multiplayer Gameplay contains six non-linear activities with no required completion order.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-003
    area: global
    statement: Singleplayer Motion Tracking contains three standalone realtime venue experiences for one visitor.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-004
    area: scope
    statement: Existing map layouts are treated as authored; the gameplay idea does not redesign the world or expose exact as-built coordinates.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-005
    area: multiplayer_shared
    statement: NPC Narration introduces each Multiplayer activity with short story/context voice.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-006
    area: multiplayer_shared
    statement: Shared Currency is used by Mari Berkebun, Mancing Dulu, and Tambang Masa Depan.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-007
    area: benteng_martello
    statement: Benteng Martello is an estimated 2–6 player PvP activity beginning with one ship per player.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-008
    area: benteng_martello
    statement: Ships can fire cannons and can be destroyed without immediately eliminating the player.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-009
    area: benteng_martello
    statement: DeathTime forces the naval phase to end; shore cannons can attack active ships and sharks threaten players in water.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-010
    area: benteng_martello
    statement: Benteng Martello ends as Last Player Standing on the island.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-011
    area: perkebunan
    statement: Mari Berkebun includes Coffee, Cinnamon, and Palm Oil with distinct maintain/harvest/regrowth loops.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-012
    area: perkebunan
    statement: Farm harvest can be sold for currency and Fertilizer accelerates growth/recovery.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-013
    area: egrang
    statement: Main Egrang is a reusable rideable mobility activity with no balance meter, random falling, timer, score, or progression.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-014
    area: fishing
    statement: Mancing Dulu uses standard Minecraft fishing behavior with Lele, Tuna, and rarer Hiu catches.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-015
    area: fishing
    statement: Fishing catches can be sold for money at the nearby Toko Madura.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-016
    area: tiger
    statement: Macan Lepas is a short PvE tiger encounter in a basement with roam, detect, chase, attack, defeat, and retry.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-017
    area: tiger
    statement: Macan Lepas is introduced by an arrogant Businessman with a Black Briefcase who calls the tiger only a “cat” and offers payment to solve the problem.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-018
