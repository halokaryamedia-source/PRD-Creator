    impact: high
    approval_status: approved
  - id: REQ-019
    area: mining
    statement: Tambang Masa Depan uses three progression tiers; higher tiers require paid access and provide higher-value resources.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-020
    area: mining
    statement: Mining resources exchange into Shared Currency used for tool upgrades and access progression.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-021
