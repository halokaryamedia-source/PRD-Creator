    impact: medium
    approval_status: approved
  - id: REQ-027
    area: fuel
    statement: Fuel balance is Pertamak > Pertali = Okibos.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-028
    area: voice
    statement: Current Voice Production contains 12 approved Voice IDs and uses Eleven v3 performance tags inside exact prompts.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-029
    area: voice
    statement: Long dialogue may be split into multiple clips when needed for natural performance, including Mari Berkebun and Mancing Dulu.
    provenance: [SRC-002]
    impact: medium
    approval_status: approved
  - id: REQ-030
    area: singleplayer
    statement: Singleplayer Motion Tracking is for one realtime exhibition/venue visitor and is separate from Multiplayer state, currency, and narration.
    provenance: [SRC-002]
    impact: high
    approval_status: approved
  - id: REQ-031
